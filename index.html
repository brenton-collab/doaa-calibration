<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02070c"><title>DOAA · Ottawa Sky</title><style>:root{--bg:#02070c;--line:#153244;--cyan:#62ddff;--ice:#dff7ff;--muted:#668899;--amber:#ffc061}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ice);font-family:system-ui,sans-serif;overscroll-behavior:none}body{background:radial-gradient(circle at 48% 43%,#09202b 0,#031019 37%,#02070c 74%)}#sky{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:absolute;top:0;left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:12px}.brand{font:600 11px ui-monospace,monospace;letter-spacing:.22em;color:var(--cyan)}.title{font-size:21px;margin-top:4px}.build{font:9px ui-monospace,monospace;color:var(--muted);margin-top:5px;letter-spacing:.04em;white-space:nowrap}.status{text-align:right;font:11px ui-monospace,monospace;color:var(--muted);line-height:1.55;max-width:55vw}.status b{color:var(--ice);font-weight:500}.status .live{color:var(--cyan)}.status .warn{color:var(--amber)}.diag{font-size:9px;color:var(--muted);overflow-wrap:anywhere}.rail{position:absolute;right:18px;top:92px;width:242px;background:rgba(4,14,21,.84);border-left:1px solid var(--line);padding:14px;backdrop-filter:blur(8px)}.rail h2{font:600 10px ui-monospace,monospace;letter-spacing:.15em;color:var(--muted);margin:0 0 10px}.row{padding:9px 0;border-top:1px solid rgba(21,50,68,.65);cursor:pointer}.row.sel{border-left:2px solid var(--cyan);padding-left:8px;background:rgba(98,221,255,.035)}.call{font:600 13px ui-monospace,monospace}.meta{font:11px ui-monospace,monospace;color:var(--muted);margin-top:3px}.foot{position:absolute;left:20px;bottom:18px;font:10px ui-monospace,monospace;color:var(--muted);pointer-events:none}.recenter{position:absolute;left:18px;bottom:56px;border:1px solid rgba(98,221,255,.25);background:rgba(4,14,21,.82);color:var(--cyan);font:10px ui-monospace,monospace;letter-spacing:.08em;padding:8px 10px;display:none}.recenter.show{display:block}.detail{position:absolute;left:18px;top:104px;min-width:180px;max-width:260px;padding:10px 12px;border-left:1px solid var(--cyan);background:rgba(4,14,21,.72);backdrop-filter:blur(7px);display:none;pointer-events:none}.detail.show{display:block}.detail .dcall{font:600 14px ui-monospace,monospace;color:var(--ice)}.detail .dmeta{font:10px ui-monospace,monospace;color:var(--muted);margin-top:4px;line-height:1.5}@media(max-width:700px){.top{padding:18px 16px}.brand{max-width:180px}.build{font-size:8px}.rail{top:auto;bottom:0;right:0;left:0;width:auto;max-height:31vh;overflow:auto;border-left:0;border-top:1px solid var(--line)}.foot{display:none}.recenter{bottom:33vh}.detail{top:108px;left:16px}}</style></head><body><canvas id="sky"></canvas><div class="top"><div><div class="brand">DOAA · OTTAWA AVIATION</div><div class="title">SKY</div><div class="build" id="build">UI sky-2 · API CHECKING</div></div><div class="status" id="status"><span class="live">ACQUIRING TRAFFIC…</span><br><b>OTTAWA</b></div></div><div class="detail" id="detail"></div><button class="recenter" id="recenter">⌖ LIVE VIEW</button><aside class="rail"><h2>NEARBY AIRCRAFT</h2><div id="rack"><div class="meta">Acquiring Ottawa traffic…</div></div></aside><div class="foot">CYOW · OTTAWA SKY · LIVE</div><script>
const UI_BUILD='sky-2',YOW={lat:45.3225,lon:-75.6692},RADIUS=45,canvas=document.querySelector('#sky'),ctx=canvas.getContext('2d'),rack=document.querySelector('#rack'),status=document.querySelector('#status'),buildEl=document.querySelector('#build'),recenter=document.querySelector('#recenter'),detail=document.querySelector('#detail');let aircraft=[],tracks=new Map(),lastGood=0,lastError='',selected=null;let view={cx:YOW.lon,cy:YOW.lat,zoom:1,manual:false},pointers=new Map(),gesture=null,lastTap=0;const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI;function hav(a,b,c,d){const R=3440.065,p1=rad(a),p2=rad(c),dp=rad(c-a),dl=rad(d-b),q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function bearing(a,b,c,d){const p1=rad(a),p2=rad(c),dl=rad(d-b);return(deg(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)))+360)%360}function norm(x){if(x.lat==null||x.lon==null)return null;let ground=x.alt_baro==='ground',alt=Number(ground?0:x.alt_baro??x.alt_geom??0),d=hav(YOW.lat,YOW.lon,x.lat,x.lon),br=bearing(YOW.lat,YOW.lon,x.lat,x.lon);return{id:String(x.hex||x.icao||Math.random()),call:String(x.flight||x.callsign||x.r||x.hex||'UNKNOWN').trim(),hex:x.hex||'',lat:x.lat,lon:x.lon,alt,ground,gs:Number(x.gs||0),trk:Number(x.track||0),vr:Number(x.baro_rate??x.geom_rate??0),d,br,type:x.t||x.type||''}}
async function refresh(){try{const r=await fetch(`/api/traffic?dist=${RADIUS}&_=${Date.now()}`,{cache:'no-store'}),j=await r.json();buildEl.textContent=`UI ${UI_BUILD} · API ${j.build||'LEGACY'}`;if(!r.ok||!j.ok){lastError=(j.errors||[`HTTP ${r.status}`]).join(' · ');throw Error(lastError)}aircraft=(j.aircraft||[]).map(norm).filter(Boolean).filter(a=>a.d<=RADIUS);aircraft.sort((a,b)=>(a.ground-b.ground)||a.d-b.d);let now=Date.now();for(const a of aircraft.filter(a=>!a.ground)){let t=tracks.get(a.id)||[];if(!t.length||now-t[t.length-1].t>3500)t.push({lat:a.lat,lon:a.lon,t:now});tracks.set(a.id,t.filter(p=>now-p.t<240000))}lastGood=now;lastError='';status.innerHTML=`<span class="live">LIVE · ${aircraft.filter(a=>!a.ground).length} AIRBORNE</span><br>${j.provider} · <b>${new Date(j.now).toISOString().slice(11,19)}Z</b>`;if(selected&&!aircraft.some(a=>a.id===selected))select(null);renderRack();draw()}catch(e){lastError=lastError||e.message||'REQUEST FAILED';if(lastGood){let age=Math.round((Date.now()-lastGood)/1000);status.innerHTML=`<span class="warn">HOLDING LAST PICTURE · ${age}s</span><br><b>REACQUIRING…</b><br><span class="diag">${lastError}</span>`}else status.innerHTML=`<span class="warn">DATA LINK UNAVAILABLE</span><br><b>RETRYING…</b><br><span class="diag">${lastError}</span>`}}
function select(id){selected=id;let a=aircraft.find(x=>x.id===id);detail.classList.toggle('show',!!a);if(a)detail.innerHTML=`<div class="dcall">${a.call}</div><div class="dmeta">${a.type||a.hex.toUpperCase()} · ${a.ground?'GROUND':Math.round(a.alt).toLocaleString()+' FT'}<br>${Math.round(a.gs)} KT · ${Math.round(a.trk).toString().padStart(3,'0')}° · ${a.ground?'GND':a.vr>200?'CLB':a.vr<-200?'DES':'LVL'}<br>${Math.round(a.d)} NM FROM YOW</div>`;renderRack();draw()}
function renderRack(){let airborne=aircraft.filter(a=>!a.ground),ground=aircraft.filter(a=>a.ground),rows=airborne.slice(0,8);if(rows.length<8)rows=rows.concat(ground.slice(0,Math.min(2,8-rows.length)));rack.innerHTML=rows.map(a=>`<div class="row ${a.id===selected?'sel':''}" data-id="${a.id}"><div class="call">${a.call}</div><div class="meta">${a.ground?'GROUND':Math.round(a.alt).toLocaleString()+' FT'} · ${Math.round(a.d)} NM YOW · ${Math.round(a.br).toString().padStart(3,'0')}°</div><div class="meta">${a.type||a.hex.toUpperCase()} · ${a.ground?'GND':a.vr>200?'CLB':a.vr<-200?'DES':'LVL'} · ${Math.round(a.gs)} KT</div></div>`).join('')||'<div class="meta">No airborne traffic in range.</div>';rack.querySelectorAll('.row').forEach(el=>el.onclick=()=>select(el.dataset.id))}
function baseScale(){return Math.min(innerWidth*.76,innerHeight*.80)/(RADIUS*2)}function nmPerLon(){return 60*Math.cos(rad(YOW.lat))}function project(lat,lon){let s=baseScale()*view.zoom,dx=(lon-view.cx)*nmPerLon(),dy=(lat-view.cy)*60;return{x:innerWidth*.46+dx*s,y:innerHeight*.52-dy*s}}function unproject(x,y){let s=baseScale()*view.zoom;return{lon:view.cx+(x-innerWidth*.46)/s/nmPerLon(),lat:view.cy-(y-innerHeight*.52)/s/60}}
function path(points,stroke,width=1){if(points.length<2)return;ctx.beginPath();points.forEach((q,i)=>{let p=project(q[0],q[1]);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}
const RIVER=[[45.47,-75.80],[45.43,-75.76],[45.40,-75.73],[45.38,-75.70],[45.36,-75.69],[45.34,-75.68],[45.31,-75.67],[45.28,-75.66],[45.24,-75.64]];const CANAL=[[45.43,-75.70],[45.40,-75.69],[45.37,-75.68],[45.34,-75.67],[45.31,-75.65]];function runway(lat,lon,heading,lenNm){let h=rad(heading),dlat=Math.cos(h)*(lenNm/2)/60,dlon=Math.sin(h)*(lenNm/2)/nmPerLon();let a=project(lat-dlat,lon-dlon),b=project(lat+dlat,lon+dlon);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='rgba(223,247,255,.26)';ctx.lineWidth=Math.max(1,1.5*view.zoom);ctx.stroke()}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);path(RIVER,'rgba(98,221,255,.075)',1.2);path(CANAL,'rgba(98,221,255,.05)',1);let c=project(YOW.lat,YOW.lon),s=baseScale()*view.zoom;ctx.strokeStyle='rgba(98,221,255,.045)';ctx.lineWidth=1;for(let r=10;r<=40;r+=10){ctx.beginPath();ctx.arc(c.x,c.y,r*s,0,Math.PI*2);ctx.stroke()}runway(YOW.lat,YOW.lon,70,1.75);runway(YOW.lat,YOW.lon,140,1.35);ctx.fillStyle='rgba(223,247,255,.72)';ctx.fillRect(c.x-2,c.y-2,4,4);ctx.font='10px ui-monospace';ctx.fillText('CYOW',c.x+7,c.y+3);let labels=[],now=Date.now();for(const a of aircraft){let p=project(a.lat,a.lon);if(p.x<-50||p.x>innerWidth+50||p.y<-50||p.y>innerHeight+50)continue;if(a.ground){ctx.fillStyle='rgba(102,136,153,.20)';ctx.fillRect(p.x-1.5,p.y-1.5,3,3);continue}let sel=a.id===selected,dim=selected&&!sel,pts=tracks.get(a.id)||[];if(pts.length>1){for(let i=1;i<pts.length;i++){let p0=project(pts[i-1].lat,pts[i-1].lon),p1=project(pts[i].lat,pts[i].lon),age=(now-pts[i].t)/240000,alpha=(sel?.65:.30)*(1-Math.min(1,age))*(dim?.22:1);ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.strokeStyle=`rgba(98,221,255,${alpha})`;ctx.lineWidth=sel?2:1;ctx.stroke()}}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(rad(a.trk));ctx.globalAlpha=dim?.22:1;ctx.fillStyle='#62ddff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=sel?12:6;ctx.beginPath();ctx.moveTo(0,sel?-8:-6);ctx.lineTo(sel?4:3,sel?6:5);ctx.lineTo(0,sel?4:3);ctx.lineTo(sel?-4:-3,sel?6:5);ctx.closePath();ctx.fill();ctx.restore();ctx.shadowBlur=0;labels.push({a,p,sel,dim})}labels.sort((x,y)=>(y.sel-x.sel)||(x.p.y-y.p.y));let placed=[];for(const {a,p,sel,dim} of labels){if(dim&&view.zoom<1.5)continue;let lx=p.x+9,ly=p.y+3,tries=0;while(placed.some(q=>Math.abs(lx-q.x)<78&&Math.abs(ly-q.y)<15)&&tries++<7)ly+=15;if(tries>=7&&!sel)continue;placed.push({x:lx,y:ly});ctx.globalAlpha=dim?.25:1;ctx.fillStyle=sel?'#dff7ff':'rgba(223,247,255,.76)';ctx.font=`${sel?'600 ':''}${view.zoom>2?'11':'10'}px ui-monospace`;ctx.fillText(a.call,lx,ly);ctx.globalAlpha=1}}
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}function manual(){view.manual=true;recenter.classList.add('show')}function resetView(){view={cx:YOW.lon,cy:YOW.lat,zoom:1,manual:false};recenter.classList.remove('show');draw()}recenter.onclick=resetView;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});if(pointers.size===2){let a=[...pointers.values()],dx=a[1].x-a[0].x,dy=a[1].y-a[0].y;gesture={dist:Math.hypot(dx,dy),zoom:view.zoom,mid:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},geo:unproject((a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2)}}});canvas.addEventListener('pointermove',e=>{let p=pointers.get(e.pointerId);if(!p)return;let ox=p.x,oy=p.y;p.x=e.clientX;p.y=e.clientY;if(pointers.size===1){let s=baseScale()*view.zoom;view.cx-=(p.x-ox)/s/nmPerLon();view.cy+=(p.y-oy)/s/60;manual();draw()}else if(pointers.size===2&&gesture){let a=[...pointers.values()],dx=a[1].x-a[0].x,dy=a[1].y-a[0].y,mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};view.zoom=Math.max(.55,Math.min(8,gesture.zoom*Math.hypot(dx,dy)/gesture.dist));let s=baseScale()*view.zoom;view.cx=gesture.geo.lon-(mid.x-innerWidth*.46)/s/nmPerLon();view.cy=gesture.geo.lat+(mid.y-innerHeight*.52)/s/60;manual();draw()}});canvas.addEventListener('pointerup',e=>{let p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(pointers.size<2)gesture=null;if(!p)return;let moved=Math.hypot(e.clientX-p.sx,e.clientY-p.sy);if(moved<8){let now=Date.now();if(now-lastTap<300){let g=unproject(e.clientX,e.clientY),old=view.zoom;view.zoom=Math.min(8,view.zoom*1.8);let s=baseScale()*view.zoom;view.cx=g.lon-(e.clientX-innerWidth*.46)/s/nmPerLon();view.cy=g.lat+(e.clientY-innerHeight*.52)/s/60;manual();draw()}else{let hit=null,best=18;for(const a of aircraft.filter(x=>!x.ground)){let q=project(a.lat,a.lon),d=Math.hypot(q.x-e.clientX,q.y-e.clientY);if(d<best){best=d;hit=a.id}}select(hit)}lastTap=now}});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);gesture=null});canvas.addEventListener('wheel',e=>{e.preventDefault();let g=unproject(e.clientX,e.clientY);view.zoom=Math.max(.55,Math.min(8,view.zoom*Math.exp(-e.deltaY*.0015)));let s=baseScale()*view.zoom;view.cx=g.lon-(e.clientX-innerWidth*.46)/s/nmPerLon();view.cy=g.lat+(e.clientY-innerHeight*.52)/s/60;manual();draw()},{passive:false});addEventListener('resize',resize);resize();refresh();setInterval(refresh,5000);
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02070c"><title>DOAA · Ottawa Sky</title><style>:root{--bg:#02070c;--line:#153244;--cyan:#62ddff;--ice:#dff7ff;--muted:#668899;--amber:#ffc061}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ice);font-family:system-ui,sans-serif}body{background:radial-gradient(circle at 48% 43%,#09202b 0,#031019 37%,#02070c 74%)}#sky{position:absolute;inset:0;width:100%;height:100%}.top{position:absolute;top:0;left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand{font:600 11px ui-monospace,monospace;letter-spacing:.22em;color:var(--cyan)}.title{font-size:21px;margin-top:4px}.status{text-align:right;font:11px ui-monospace,monospace;color:var(--muted);line-height:1.55}.status b{color:var(--ice);font-weight:500}.status .live{color:var(--cyan)}.status .warn{color:var(--amber)}.rail{position:absolute;right:18px;top:92px;width:242px;background:rgba(4,14,21,.84);border-left:1px solid var(--line);padding:14px;backdrop-filter:blur(8px)}.rail h2{font:600 10px ui-monospace,monospace;letter-spacing:.15em;color:var(--muted);margin:0 0 10px}.row{padding:9px 0;border-top:1px solid rgba(21,50,68,.65)}.call{font:600 13px ui-monospace,monospace}.meta{font:11px ui-monospace,monospace;color:var(--muted);margin-top:3px}.look{color:var(--amber)}.foot{position:absolute;left:20px;bottom:18px;font:10px ui-monospace,monospace;color:var(--muted)}@media(max-width:700px){.rail{top:auto;bottom:0;right:0;left:0;width:auto;max-height:31vh;overflow:auto;border-left:0;border-top:1px solid var(--line)}.foot{display:none}}</style></head><body><canvas id="sky"></canvas><div class="top"><div><div class="brand">DOAA · OTTAWA AVIATION</div><div class="title">SKY</div></div><div class="status" id="status"><span class="live">ACQUIRING TRAFFIC…</span><br><b>OTTAWA</b></div></div><aside class="rail"><h2>NEARBY AIRCRAFT</h2><div id="rack"><div class="meta">Acquiring Ottawa traffic…</div></div></aside><div class="foot">CYOW · HOME SKY · LIVE</div><script>
const HOME={lat:45.37094,lon:-75.70229},YOW={lat:45.3225,lon:-75.6692},RADIUS=45,canvas=document.querySelector('#sky'),ctx=canvas.getContext('2d'),rack=document.querySelector('#rack'),status=document.querySelector('#status');let aircraft=[],tracks=new Map(),lastGood=0,failures=0;const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI;function hav(a,b,c,d){const R=3440.065,p1=rad(a),p2=rad(c),dp=rad(c-a),dl=rad(d-b),q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function bearing(a,b,c,d){const p1=rad(a),p2=rad(c),dl=rad(d-b);return(deg(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)))+360)%360}function visible(b){return b>=205&&b<=359}function norm(x){if(x.lat==null||x.lon==null)return null;let ground=x.alt_baro==='ground',alt=Number(ground?0:x.alt_baro??x.alt_geom??0),d=hav(HOME.lat,HOME.lon,x.lat,x.lon),br=bearing(HOME.lat,HOME.lon,x.lat,x.lon);return{id:String(x.hex||x.icao||Math.random()),call:String(x.flight||x.callsign||x.r||x.hex||'UNKNOWN').trim(),hex:x.hex||'',lat:x.lat,lon:x.lon,alt,ground,gs:Number(x.gs||0),trk:Number(x.track||0),vr:Number(x.baro_rate??x.geom_rate??0),d,br,type:x.t||x.type||'',visible:visible(br)&&alt>300}}
async function refresh(){try{const r=await fetch(`/api/traffic?lat=${HOME.lat}&lon=${HOME.lon}&dist=${RADIUS}`,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error((j.errors||['API unavailable']).join(' · '));aircraft=(j.aircraft||[]).map(norm).filter(Boolean).filter(a=>a.d<=RADIUS);aircraft.sort((a,b)=>(a.ground-b.ground)||a.d-b.d);let now=Date.now();for(const a of aircraft.filter(a=>!a.ground)){let t=tracks.get(a.id)||[];t.push({lat:a.lat,lon:a.lon,t:now});tracks.set(a.id,t.filter(p=>now-p.t<180000))}lastGood=now;failures=0;status.innerHTML=`<span class="live">LIVE · ${aircraft.filter(a=>!a.ground).length} AIRBORNE</span><br>${j.provider} · <b>${new Date(j.now).toISOString().slice(11,19)}Z</b>`;renderRack();draw()}catch(e){failures++;if(lastGood){let age=Math.round((Date.now()-lastGood)/1000);status.innerHTML=`<span class="warn">HOLDING LAST PICTURE · ${age}s</span><br><b>REACQUIRING…</b>`}else if(failures<4){status.innerHTML=`<span class="live">ACQUIRING TRAFFIC…</span><br><b>OTTAWA</b>`}else{status.innerHTML=`<span class="warn">DATA LINK UNAVAILABLE</span><br><b>RETRYING…</b>`}}}
function renderRack(){let airborne=aircraft.filter(a=>!a.ground),ground=aircraft.filter(a=>a.ground);let rows=airborne.slice(0,8);if(rows.length<8)rows=rows.concat(ground.slice(0,Math.min(2,8-rows.length)));rack.innerHTML=rows.map(a=>`<div class="row"><div class="call ${a.visible?'look':''}">${a.visible?'◈ ':''}${a.call}</div><div class="meta">${a.ground?'GROUND':Math.round(a.alt).toLocaleString()+' FT'} · ${Math.round(a.d)} NM · ${Math.round(a.br).toString().padStart(3,'0')}°</div><div class="meta">${a.type||a.hex.toUpperCase()} · ${a.ground?'GND':a.vr>200?'CLB':a.vr<-200?'DES':'LVL'} · ${Math.round(a.gs)} KT</div></div>`).join('')||'<div class="meta">No airborne traffic in range.</div>'}
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}function project(lat,lon){const dx=hav(HOME.lat,HOME.lon,HOME.lat,lon)*(lon<HOME.lon?-1:1),dy=hav(HOME.lat,HOME.lon,lat,HOME.lon)*(lat<HOME.lat?-1:1),s=Math.min(innerWidth*.72,innerHeight*.82)/(RADIUS*2);return{x:innerWidth*.43+dx*s,y:innerHeight*.52-dy*s}}function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);let c=project(HOME.lat,HOME.lon),s=Math.min(innerWidth*.72,innerHeight*.82)/(RADIUS*2);ctx.strokeStyle='rgba(98,221,255,.065)';for(let r=10;r<=40;r+=10){ctx.beginPath();ctx.arc(c.x,c.y,r*s,0,Math.PI*2);ctx.stroke()}let y=project(YOW.lat,YOW.lon);ctx.fillStyle='rgba(223,247,255,.6)';ctx.fillRect(y.x-2,y.y-2,4,4);ctx.font='10px ui-monospace';ctx.fillText('CYOW',y.x+7,y.y+3);ctx.fillStyle='rgba(98,221,255,.48)';ctx.fillRect(c.x-2,c.y-2,4,4);ctx.fillText('HOME',c.x+7,c.y+3);let labels=[];for(const a of aircraft){let p=project(a.lat,a.lon);if(a.ground){ctx.fillStyle='rgba(102,136,153,.28)';ctx.fillRect(p.x-1.5,p.y-1.5,3,3);continue}let pts=tracks.get(a.id)||[];if(pts.length>1){ctx.beginPath();pts.forEach((q,i)=>{let z=project(q.lat,q.lon);i?ctx.lineTo(z.x,z.y):ctx.moveTo(z.x,z.y)});ctx.strokeStyle='rgba(98,221,255,.20)';ctx.stroke()}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(rad(a.trk));ctx.fillStyle=a.visible?'#ffc061':'#62ddff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=7;ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(3,5);ctx.lineTo(0,3);ctx.lineTo(-3,5);ctx.closePath();ctx.fill();ctx.restore();ctx.shadowBlur=0;labels.push({a,p})}labels.sort((x,y)=>x.p.y-y.p.y);let placed=[];for(const {a,p} of labels){let lx=p.x+8,ly=p.y+3;for(const q of placed){if(Math.abs(lx-q.x)<65&&Math.abs(ly-q.y)<13)ly=q.y+13}placed.push({x:lx,y:ly});ctx.fillStyle=a.visible?'#ffc061':'rgba(223,247,255,.78)';ctx.font='10px ui-monospace';ctx.fillText(a.call,lx,ly)}}addEventListener('resize',resize);resize();refresh();setInterval(refresh,5000);
</script></body></html>

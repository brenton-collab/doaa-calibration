<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02070c"><title>DOAA · Ottawa Sky</title><style>:root{--bg:#02070c;--line:#153244;--cyan:#62ddff;--ice:#f1fbff;--muted:#668899;--amber:#ffc061}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ice);font-family:system-ui,sans-serif;overscroll-behavior:none}body{background:radial-gradient(circle at 48% 38%,#09202b 0,#031019 38%,#02070c 76%)}#maptiles,#sky{position:absolute;inset:0;width:100%;height:100%}#maptiles{overflow:hidden;pointer-events:none;opacity:.23;filter:grayscale(1) sepia(1) saturate(5) hue-rotate(145deg) brightness(.58) contrast(1.45)}#maptiles img{position:absolute;max-width:none;user-select:none}#sky{touch-action:none}.osm{position:absolute;left:8px;bottom:32vh;font:7px ui-monospace,monospace;color:rgba(98,221,255,.35);pointer-events:none}.top{position:absolute;top:0;left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}.brand{font:600 11px ui-monospace,monospace;letter-spacing:.22em;color:var(--cyan)}.title{font-size:21px;margin-top:4px}.build{font:9px ui-monospace,monospace;color:var(--muted);margin-top:5px;letter-spacing:.04em;white-space:nowrap}.status{text-align:right;font:11px ui-monospace,monospace;color:var(--muted);line-height:1.55;white-space:nowrap;flex:0 0 auto}.status b{color:var(--ice);font-weight:500}.status .live{color:var(--cyan)}.status .warn{color:var(--amber)}.diag{font-size:9px;color:var(--muted)}.rail{position:absolute;right:18px;top:92px;width:242px;background:rgba(4,14,21,.84);border-left:1px solid var(--line);padding:14px;backdrop-filter:blur(8px)}.rail h2{font:600 10px ui-monospace,monospace;letter-spacing:.15em;color:var(--muted);margin:0 0 10px}.row{padding:9px 0;border-top:1px solid rgba(21,50,68,.65);cursor:pointer}.row.sel{border-left:2px solid var(--ice);padding-left:8px;background:rgba(241,251,255,.035)}.call{font:600 13px ui-monospace,monospace}.meta{font:11px ui-monospace,monospace;color:var(--muted);margin-top:3px}.recenter{position:absolute;left:18px;bottom:56px;border:1px solid rgba(98,221,255,.25);background:rgba(4,14,21,.82);color:var(--cyan);font:10px ui-monospace,monospace;letter-spacing:.08em;padding:8px 10px;display:none}.recenter.show{display:block}.detail{position:absolute;left:18px;top:104px;min-width:180px;max-width:260px;padding:10px 12px;border-left:1px solid var(--ice);background:rgba(4,14,21,.76);backdrop-filter:blur(7px);display:none;pointer-events:none}.detail.show{display:block}.dcall{font:600 14px ui-monospace,monospace}.dmeta{font:10px ui-monospace,monospace;color:var(--muted);margin-top:4px;line-height:1.5}@media(max-width:700px){.top{padding:18px 16px;gap:5px}.top>div:first-child{min-width:0;flex:1}.brand{font-size:10px;letter-spacing:.18em;max-width:175px}.build{font-size:8px}.status{font-size:10px}.rail{top:auto;bottom:0;right:0;left:0;width:auto;max-height:31vh;overflow:auto;border-left:0;border-top:1px solid var(--line)}.recenter{bottom:33vh}.detail{top:108px;left:16px}}</style></head><body><div id="maptiles"></div><canvas id="sky"></canvas><div class="osm">© OPENSTREETMAP CONTRIBUTORS</div><div class="top"><div><div class="brand">DOAA · OTTAWA AVIATION</div><div class="title">SKY</div><div class="build" id="build">UI sky-5 · API CHECKING</div></div><div class="status" id="status"><span class="live">ACQUIRING TRAFFIC…</span><br><b>OTTAWA</b></div></div><div class="detail" id="detail"></div><button class="recenter" id="recenter">⌖ LIVE VIEW</button><aside class="rail"><h2>NEARBY AIRCRAFT</h2><div id="rack"><div class="meta">Acquiring Ottawa traffic…</div></div></aside><script>
const UI_BUILD='sky-5',YOW={lat:45.3225,lon:-75.6692},RADIUS=45,canvas=document.querySelector('#sky'),ctx=canvas.getContext('2d'),tiles=document.querySelector('#maptiles'),rack=document.querySelector('#rack'),status=document.querySelector('#status'),buildEl=document.querySelector('#build'),recenter=document.querySelector('#recenter'),detail=document.querySelector('#detail');let aircraft=[],tracks=new Map(),lastGood=0,lastError='',selected=null,tileSig='';let view={cx:YOW.lon,cy:YOW.lat,zoom:1},pointers=new Map(),gesture=null,lastTap=0;const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI;function hav(a,b,c,d){const R=3440.065,p1=rad(a),p2=rad(c),dp=rad(c-a),dl=rad(d-b),q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function bearing(a,b,c,d){const p1=rad(a),p2=rad(c),dl=rad(d-b);return(deg(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)))+360)%360}function norm(x){if(x.lat==null||x.lon==null)return null;let ground=x.alt_baro==='ground',alt=Number(ground?0:x.alt_baro??x.alt_geom??0),d=hav(YOW.lat,YOW.lon,x.lat,x.lon);return{id:String(x.hex||x.icao||'').toLowerCase(),call:String(x.flight||x.callsign||x.r||x.hex||'UNKNOWN').trim(),hex:x.hex||'',lat:x.lat,lon:x.lon,alt,ground,gs:Number(x.gs||0),trk:Number(x.track||0),vr:Number(x.baro_rate??x.geom_rate??0),d,br:bearing(YOW.lat,YOW.lon,x.lat,x.lon),type:x.t||x.type||''}}
async function refresh(){try{const r=await fetch(`/api/traffic?dist=${RADIUS}&_=${Date.now()}`,{cache:'no-store'}),j=await r.json();buildEl.textContent=`UI ${UI_BUILD} · API ${j.build||'LEGACY'}`;if(!r.ok||!j.ok)throw Error((j.errors||[`HTTP ${r.status}`]).join(' · '));aircraft=(j.aircraft||[]).map(norm).filter(a=>a&&a.id&&a.d<=RADIUS).sort((a,b)=>(a.ground-b.ground)||a.d-b.d);tracks=new Map(Object.entries(j.tracks||{}).map(([id,e])=>[id.toLowerCase(),e]));lastGood=Date.now();lastError='';status.innerHTML=`<span class="live">${aircraft.filter(a=>!a.ground).length} AIRBORNE / YOW ${RADIUS}</span><br>${j.provider} · <b>${new Date(j.now).toISOString().slice(11,19)}Z</b>`;if(selected&&!aircraft.some(a=>a.id===selected))select(null);renderRack();draw()}catch(e){lastError=e.message||'REQUEST FAILED';status.innerHTML=lastGood?`<span class="warn">HOLDING LAST PICTURE · ${Math.round((Date.now()-lastGood)/1000)}s</span><br><b>REACQUIRING…</b>`:`<span class="warn">DATA LINK UNAVAILABLE</span><br><b>RETRYING…</b>`}}
function select(id){selected=id;let a=aircraft.find(x=>x.id===id),e=tracks.get(id);detail.classList.toggle('show',!!a);if(a){let mins=e?.firstSeen?Math.max(1,Math.round((Date.now()-e.firstSeen)/60000)):0;detail.innerHTML=`<div class="dcall">${a.call}</div><div class="dmeta">${a.type||a.hex.toUpperCase()} · ${a.ground?'GROUND':Math.round(a.alt).toLocaleString()+' FT'}<br>${Math.round(a.gs)} KT · ${Math.round(a.trk).toString().padStart(3,'0')}° · ${a.ground?'GND':a.vr>200?'CLB':a.vr<-200?'DES':'LVL'}<br>${Math.round(a.d)} NM FROM YOW${mins?` · ${mins} MIN OBSERVED`:''}</div>`}renderRack();draw()}
function renderRack(){let rows=aircraft.filter(a=>!a.ground).slice(0,8);if(rows.length<8)rows.push(...aircraft.filter(a=>a.ground).slice(0,Math.min(2,8-rows.length)));rack.innerHTML=rows.map(a=>`<div class="row ${a.id===selected?'sel':''}" data-id="${a.id}"><div class="call">${a.call}</div><div class="meta">${a.ground?'GROUND':Math.round(a.alt).toLocaleString()+' FT'} · ${Math.round(a.d)} NM YOW · ${Math.round(a.br).toString().padStart(3,'0')}°</div><div class="meta">${a.type||a.hex.toUpperCase()} · ${a.ground?'GND':a.vr>200?'CLB':a.vr<-200?'DES':'LVL'} · ${Math.round(a.gs)} KT</div></div>`).join('')||'<div class="meta">No airborne traffic in range.</div>';rack.querySelectorAll('.row').forEach(el=>el.onclick=()=>select(el.dataset.id))}
function mapArea(){let m=innerWidth<=700,top=92,bottom=m?innerHeight*.31:18,right=m?0:278;return{left:0,right,top,bottom,w:innerWidth-right,h:innerHeight-top-bottom,cx:(innerWidth-right)/2,cy:top+(innerHeight-top-bottom)/2}}function baseScale(){let a=mapArea();return Math.min(a.w*.90,a.h*.94)/(RADIUS*2)}function anchor(){let a=mapArea();return{x:a.cx,y:a.cy}}function nmPerLon(){return 60*Math.cos(rad(YOW.lat))}function project(lat,lon){let s=baseScale()*view.zoom,o=anchor();return{x:o.x+(lon-view.cx)*nmPerLon()*s,y:o.y-(lat-view.cy)*60*s}}function unproject(x,y){let s=baseScale()*view.zoom,o=anchor();return{lon:view.cx+(x-o.x)/s/nmPerLon(),lat:view.cy-(y-o.y)/s/60}}
function lon2x(l,z){return Math.floor((l+180)/360*2**z)}function lat2y(lat,z){let r=rad(lat);return Math.floor((1-Math.asinh(Math.tan(r))/Math.PI)/2*2**z)}function x2lon(x,z){return x/2**z*360-180}function y2lat(y,z){return deg(Math.atan(Math.sinh(Math.PI*(1-2*y/2**z))))}function renderTiles(){let a=mapArea(),nw=unproject(a.left,a.top),se=unproject(innerWidth-a.right,innerHeight-a.bottom),z=view.zoom<1.35?9:view.zoom<2.6?10:view.zoom<5?11:12,x0=lon2x(nw.lon,z)-1,x1=lon2x(se.lon,z)+1,y0=lat2y(nw.lat,z)-1,y1=lat2y(se.lat,z)+1,sig=[z,x0,x1,y0,y1,view.cx.toFixed(3),view.cy.toFixed(3),view.zoom.toFixed(2)].join(':');if(sig===tileSig)return;tileSig=sig;tiles.replaceChildren();for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){let p1=project(y2lat(y,z),x2lon(x,z)),p2=project(y2lat(y+1,z),x2lon(x+1,z)),im=new Image();im.src=`https://tile.openstreetmap.org/${z}/${x}/${y}.png`;im.alt='';im.style.left=p1.x+'px';im.style.top=p1.y+'px';im.style.width=(p2.x-p1.x+1)+'px';im.style.height=(p2.y-p1.y+1)+'px';tiles.appendChild(im)}}
function runway(lat,lon,heading,len){let h=rad(heading),a=project(lat-Math.cos(h)*len/120,lon-Math.sin(h)*len/120/nmPerLon()),b=project(lat+Math.cos(h)*len/120,lon+Math.sin(h)*len/120/nmPerLon());ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='rgba(98,221,255,.42)';ctx.lineWidth=1.2;ctx.stroke()}function trailAlpha(age,sel,dim){let m=age/60000,a=m<=5?.78-m*.045:m<=15?.555-(m-5)*.026:m<=30?.295-(m-15)*.011:sel?Math.max(.07,.13-(m-30)*.001):.035;return a*(dim?.18:1)}
function draw(){renderTiles();ctx.clearRect(0,0,innerWidth,innerHeight);let c=project(YOW.lat,YOW.lon),s=baseScale()*view.zoom;ctx.strokeStyle='rgba(98,221,255,.035)';for(let r=10;r<=40;r+=10){ctx.beginPath();ctx.arc(c.x,c.y,r*s,0,Math.PI*2);ctx.stroke()}runway(YOW.lat,YOW.lon,70,1.75);runway(YOW.lat,YOW.lon,140,1.35);ctx.fillStyle='rgba(98,221,255,.85)';ctx.fillRect(c.x-2,c.y-2,4,4);ctx.font='10px ui-monospace';ctx.fillText('CYOW',c.x+7,c.y+3);let labels=[],now=Date.now();for(const a of aircraft){let p=project(a.lat,a.lon);if(p.x<-50||p.x>innerWidth+50||p.y<-50||p.y>innerHeight+50)continue;if(a.ground){ctx.fillStyle='rgba(241,251,255,.18)';ctx.fillRect(p.x-1.5,p.y-1.5,3,3);continue}let sel=a.id===selected,dim=selected&&!sel,pts=tracks.get(a.id)?.points||[];if(pts.length>1)for(let i=1;i<pts.length;i++){let age=now-pts[i].t;if(!sel&&age>30*60000)continue,p0=project(pts[i-1].lat,pts[i-1].lon),p1=project(pts[i].lat,pts[i].lon);ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.strokeStyle=`rgba(241,251,255,${trailAlpha(age,sel,dim)})`;ctx.lineWidth=sel?2:1.25;ctx.stroke()}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(rad(a.trk));ctx.globalAlpha=dim?.18:1;ctx.fillStyle='#f1fbff';ctx.shadowColor='#dff7ff';ctx.shadowBlur=sel?11:3;ctx.beginPath();ctx.moveTo(0,sel?-8:-6);ctx.lineTo(sel?4:3,sel?6:5);ctx.lineTo(0,sel?4:3);ctx.lineTo(sel?-4:-3,sel?6:5);ctx.closePath();ctx.fill();ctx.restore();ctx.shadowBlur=0;labels.push({a,p,sel,dim})}labels.sort((x,y)=>(y.sel-x.sel)||(x.a.d-y.a.d));let placed=[];for(const q of labels){if(!(q.sel||view.zoom>=1.35||q.a.d<=12)||q.dim&&view.zoom<1.5)continue;let x=q.p.x+9,y=q.p.y+3,n=0;while(placed.some(p=>Math.abs(x-p.x)<78&&Math.abs(y-p.y)<15)&&n++<7)y+=15;if(n>=7&&!q.sel)continue;placed.push({x,y});ctx.globalAlpha=q.dim?.22:1;ctx.fillStyle=q.sel?'#fff':'rgba(241,251,255,.82)';ctx.font=`${q.sel?'600 ':''}${view.zoom>2?'11':'10'}px ui-monospace`;ctx.fillText(q.a.call,x,y);ctx.globalAlpha=1}}
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);tileSig='';draw()}function manual(){recenter.classList.add('show')}function resetView(){view={cx:YOW.lon,cy:YOW.lat,zoom:1};recenter.classList.remove('show');tileSig='';draw()}recenter.onclick=resetView;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});if(pointers.size===2){let a=[...pointers.values()],dx=a[1].x-a[0].x,dy=a[1].y-a[0].y;gesture={dist:Math.hypot(dx,dy),zoom:view.zoom,geo:unproject((a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2)}}});canvas.addEventListener('pointermove',e=>{let p=pointers.get(e.pointerId);if(!p)return,ox=p.x,oy=p.y;p.x=e.clientX;p.y=e.clientY;if(pointers.size===1){let s=baseScale()*view.zoom;view.cx-=(p.x-ox)/s/nmPerLon();view.cy+=(p.y-oy)/s/60;manual();draw()}else if(pointers.size===2&&gesture){let a=[...pointers.values()],dx=a[1].x-a[0].x,dy=a[1].y-a[0].y,mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};view.zoom=Math.max(.55,Math.min(8,gesture.zoom*Math.hypot(dx,dy)/gesture.dist));let s=baseScale()*view.zoom,o=anchor();view.cx=gesture.geo.lon-(mid.x-o.x)/s/nmPerLon();view.cy=gesture.geo.lat+(mid.y-o.y)/s/60;manual();draw()}});canvas.addEventListener('pointerup',e=>{let p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(pointers.size<2)gesture=null;if(!p)return;if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)<8){let now=Date.now();if(now-lastTap<300){let g=unproject(e.clientX,e.clientY);view.zoom=Math.min(8,view.zoom*1.8);let s=baseScale()*view.zoom,o=anchor();view.cx=g.lon-(e.clientX-o.x)/s/nmPerLon();view.cy=g.lat+(e.clientY-o.y)/s/60;manual();draw()}else{let hit=null,best=18;for(const a of aircraft.filter(x=>!x.ground)){let q=project(a.lat,a.lon),d=Math.hypot(q.x-e.clientX,q.y-e.clientY);if(d<best){best=d;hit=a.id}}select(hit)}lastTap=now}});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);gesture=null});canvas.addEventListener('wheel',e=>{e.preventDefault();let g=unproject(e.clientX,e.clientY);view.zoom=Math.max(.55,Math.min(8,view.zoom*Math.exp(-e.deltaY*.0015)));let s=baseScale()*view.zoom,o=anchor();view.cx=g.lon-(e.clientX-o.x)/s/nmPerLon();view.cy=g.lat+(e.clientY-o.y)/s/60;manual();draw()},{passive:false});addEventListener('resize',resize);resize();refresh();setInterval(refresh,5000);
</script></body></html>

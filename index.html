<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02070c"><title>DOAA · Ottawa Sky</title><style>:root{--bg:#02070c;--line:#153244;--cyan:#62ddff;--ice:#f1fbff;--muted:#668899;--purple:#b58cff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ice);font-family:system-ui,sans-serif;overscroll-behavior:none}#geo,#sky{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:absolute;inset:0 0 auto;padding:18px 16px;display:flex;justify-content:space-between;pointer-events:none}.brand{font:600 10px ui-monospace;letter-spacing:.18em;color:var(--cyan);max-width:190px}.title{font-size:21px;margin-top:4px}.build{font:8px ui-monospace;color:var(--muted);margin-top:5px}.status{pointer-events:auto;text-align:right;font:10px ui-monospace;color:var(--muted);line-height:1.55;white-space:nowrap;cursor:pointer}.live{color:var(--cyan)}.view{color:var(--purple)}.rail{position:absolute;bottom:0;left:0;right:0;max-height:31vh;overflow:auto;background:#020a10;border-top:1px solid var(--line);padding:12px 16px}.rail h2{font:600 10px ui-monospace;letter-spacing:.15em;color:var(--muted);margin:0 0 10px}.row{padding:9px 0;border-top:1px solid rgba(21,50,68,.65)}.call{font:600 13px ui-monospace}.meta{font:11px ui-monospace;color:var(--muted);margin-top:3px}.recenter{position:absolute;left:18px;bottom:33vh;border:1px solid rgba(98,221,255,.45);background:#020a10;color:var(--cyan);font:10px ui-monospace;letter-spacing:.08em;padding:9px 11px;display:none}.pick{position:fixed;right:14px;top:70px;z-index:20;background:#020a10;border:1px solid #24485c;padding:8px;display:none;grid-template-columns:repeat(3,1fr);gap:5px}.pick.show{display:grid}.pick button{background:#06131c;border:1px solid #24485c;color:#8aa9b8;font:10px ui-monospace;padding:8px}.pick button.on{color:var(--cyan);border-color:var(--cyan)}.attrib{position:absolute;left:8px;bottom:31.5vh;font:7px ui-monospace;color:rgba(98,221,255,.58)}@media(min-width:701px){.rail{left:auto;top:92px;bottom:auto;right:18px;width:250px;max-height:calc(100vh - 110px);border:1px solid var(--line)}.recenter{bottom:56px}.attrib{bottom:8px}}</style></head><body><canvas id="geo"></canvas><canvas id="sky"></canvas><div class="top"><div><div class="brand">DOAA · OTTAWA AVIATION</div><div class="title">SKY</div><div class="build" id="build">UI sky-7.1 · API CHECKING</div></div><div class="status" id="status">ACQUIRING…</div></div><button id="recenter" class="recenter">⌖ LIVE VIEW</button><div id="pick" class="pick"></div><div id="attrib" class="attrib">MAP vector-native · LOADING</div><aside class="rail"><h2>NEARBY AIRCRAFT</h2><div id="rack"></div></aside><script>
const UI='sky-7.1',YOW={lat:45.3225,lon:-75.6692},STEPS=[10,20,30,40,45,50,60,70,80],C='#62ddff',P='#b58cff';let configured=45,view={cx:YOW.lon,cy:YOW.lat,zoom:1},manual=false,aircraft=[],tracks=new Map(),features=[],provider='ADS-B',now=Date.now(),pointers=new Map(),gesture=null;const sky=document.querySelector('#sky'),ctx=sky.getContext('2d'),geo=document.querySelector('#geo'),g=geo.getContext('2d'),status=document.querySelector('#status'),rack=document.querySelector('#rack'),build=document.querySelector('#build'),pick=document.querySelector('#pick'),recenter=document.querySelector('#recenter'),attrib=document.querySelector('#attrib');const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI,nmlon=()=>60*Math.cos(rad(YOW.lat));function hav(a,b,c,d){let R=3440.065,p1=rad(a),p2=rad(c),dp=rad(c-a),dl=rad(d-b),q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function bearing(a,b,c,d){let p1=rad(a),p2=rad(c),dl=rad(d-b);return(deg(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)))+360)%360}function area(){let m=innerWidth<=700,top=92,bottom=m?innerHeight*.31:18,right=m?0:278,w=innerWidth-right,h=innerHeight-top-bottom;return{left:0,right,top,bottom,w,h,cx:w*.46,cy:top+h*.44}}function baseScale(){let a=area();return Math.min(a.w*.90,a.h*.94)/(configured*2)}function project(lat,lon){let s=baseScale()*view.zoom,a=area();return{x:a.cx+(lon-view.cx)*nmlon()*s,y:a.cy-(lat-view.cy)*60*s}}function unproject(x,y){let s=baseScale()*view.zoom,a=area();return{lon:view.cx+(x-a.cx)/s/nmlon(),lat:view.cy-(y-a.cy)/s/60}}function resize(){let d=devicePixelRatio||1;for(const c of[sky,geo]){c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';c.getContext('2d').setTransform(d,0,0,d,0,0)}draw()}function extent(){let a=area(),c=unproject(a.cx,a.cy),e=unproject(a.left+a.w,a.cy);return Math.max(1,Math.round(hav(c.lat,c.lon,e.lat,e.lon)))}function centered(){return hav(YOW.lat,YOW.lon,view.cy,view.cx)<Math.max(1,configured*.025)}function inView(a){let p=project(a.lat,a.lon),z=area();return p.x>=z.left&&p.x<=z.left+z.w&&p.y>=z.top&&p.y<=innerHeight-z.bottom}function norm(x){if(x.lat==null||x.lon==null)return null;let ground=x.alt_baro==='ground',alt=Number(ground?0:x.alt_baro??x.alt_geom??0),d=hav(YOW.lat,YOW.lon,x.lat,x.lon);return{id:String(x.hex||'').toLowerCase(),call:String(x.flight||x.r||x.hex||'UNKNOWN').trim(),lat:x.lat,lon:x.lon,alt,ground,gs:Number(x.gs||0),trk:Number(x.track||0),vr:Number(x.baro_rate??x.geom_rate??0),d,br:bearing(YOW.lat,YOW.lon,x.lat,x.lon),type:x.t||''}}function reset(){view={cx:YOW.lon,cy:YOW.lat,zoom:1};manual=false;draw();refresh()}function renderPick(){pick.innerHTML=STEPS.map(n=>`<button data-n="${n}" class="${n===configured?'on':''}">${n} NM</button>`).join('');pick.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();configured=+b.dataset.n;renderPick();pick.classList.remove('show');reset()})}status.onclick=e=>{e.stopPropagation();pick.classList.toggle('show')};document.addEventListener('click',()=>pick.classList.remove('show'));recenter.onclick=reset;
function path(f,c){c.beginPath();f.pts.forEach((q,i)=>{let p=project(q.lat,q.lon);i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)});c.stroke()}function mapLabel(text,lat,lon,alpha=.62,size=9){let p=project(lat,lon);g.shadowBlur=0;g.fillStyle=`rgba(98,221,255,${alpha})`;g.font=`${size}px ui-monospace`;g.fillText(text,p.x,p.y)}function drawGeo(){g.clearRect(0,0,innerWidth,innerHeight);g.fillStyle='#02070c';g.fillRect(0,0,innerWidth,innerHeight);g.lineCap='round';g.lineJoin='round';for(const f of features.filter(x=>x.kind==='road')){g.shadowBlur=0;g.strokeStyle=f.major===3?'rgba(84,166,196,.68)':f.major===2?'rgba(68,139,166,.52)':'rgba(55,111,134,.38)';g.lineWidth=f.major===3?1.8:f.major===2?1.3:.9;path(f,g)}for(const f of features.filter(x=>x.kind==='water')){g.shadowColor='rgba(36,205,245,.48)';g.shadowBlur=f.major===3?8:f.major===2?4:2;g.strokeStyle=f.major===3?'rgba(53,215,250,1)':f.major===2?'rgba(58,194,229,.92)':'rgba(45,145,176,.62)';g.lineWidth=f.major===3?15:f.major===2?7:2.2;path(f,g)}g.shadowBlur=0;mapLabel('OTTAWA',45.4215,-75.6972,.52,11);mapLabel('Gatineau',45.4765,-75.7013,.44,9);mapLabel('Ottawa River',45.445,-75.82,.78,9);mapLabel('Rideau River',45.29,-75.66,.70,9);mapLabel('Rideau Canal',45.18,-75.71,.62,9)}function trailAlpha(age){let m=age/60000;return m<=5?.75:m<=15?.5:m<=30?.28:.06}function draw(){drawGeo();ctx.clearRect(0,0,innerWidth,innerHeight);let c=project(YOW.lat,YOW.lon),s=baseScale()*view.zoom;ctx.strokeStyle='rgba(98,221,255,.13)';ctx.setLineDash([3,4]);for(let r=10;r<=configured;r+=10){ctx.beginPath();ctx.arc(c.x,c.y,r*s,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(102,136,153,.75)';ctx.font='8px ui-monospace';ctx.fillText(r+' NM',c.x+r*s*.72,c.y-r*s*.69)}ctx.setLineDash([]);ctx.fillStyle=C;ctx.fillRect(c.x-2,c.y-2,4,4);ctx.font='10px ui-monospace';ctx.fillText('CYOW',c.x+7,c.y+3);let vis=aircraft.filter(a=>!a.ground&&inView(a)),t=Date.now();for(const a of vis){let pts=tracks.get(a.id)?.points||[];for(let i=1;i<pts.length;i++){let age=t-pts[i].t;if(age>1800000)continue;let p0=project(pts[i-1].lat,pts[i-1].lon),p1=project(pts[i].lat,pts[i].lon);ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.strokeStyle=`rgba(241,251,255,${trailAlpha(age)})`;ctx.lineWidth=1.25;ctx.stroke()}let p=project(a.lat,a.lon);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(rad(a.trk));ctx.fillStyle='#f1fbff';ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(3,5);ctx.lineTo(0,3);ctx.lineTo(-3,5);ctx.closePath();ctx.fill();ctx.restore();if(a.d<15||view.zoom>1.25){ctx.fillStyle='rgba(241,251,255,.85)';ctx.font='10px ui-monospace';ctx.fillText(a.call,p.x+8,p.y+3)}}let live=!manual&&centered(),label=centered()?'YOW':'VIEW',r=live?configured:extent(),cl=live?'live':'view';status.innerHTML=`<span class="${cl}">${vis.length} AIRBORNE / ${label} ${r}</span><br>${provider} · ${new Date(now).toISOString().slice(11,19)}Z`;recenter.style.display=live?'none':'block';rack.innerHTML=vis.sort((a,b)=>a.d-b.d).slice(0,8).map(a=>`<div class="row"><div class="call">${a.call}</div><div class="meta">${Math.round(a.alt).toLocaleString()} FT · ${Math.round(a.d)} NM YOW · ${Math.round(a.br).toString().padStart(3,'0')}°</div><div class="meta">${a.type||a.id.toUpperCase()} · ${a.vr>200?'CLB':a.vr<-200?'DES':'LVL'} · ${Math.round(a.gs)} KT</div></div>`).join('')||'<div class="meta">No airborne traffic in view.</div>'}
async function refresh(){try{let need=Math.min(80,Math.max(configured,extent()+Math.ceil(hav(YOW.lat,YOW.lon,view.cy,view.cx)))),r=await fetch(`/api/traffic?dist=${need}&_=${Date.now()}`,{cache:'no-store'}),j=await r.json();build.textContent=`UI ${UI} · API ${j.build||'LEGACY'}`;aircraft=(j.aircraft||[]).map(norm).filter(Boolean);tracks=new Map(Object.entries(j.tracks||{}).map(([id,e])=>[id.toLowerCase(),e]));provider=j.provider||'ADS-B';now=j.now||Date.now();draw()}catch(e){status.innerHTML='<span style="color:#ffc061">DATA LINK UNAVAILABLE</span>'}}async function loadMap(){try{let r=await fetch('/api/map',{cache:'no-store'}),j=await r.json();features=j.features||[];attrib.textContent=`MAP vector-native · READY · ${features.length} FEATURES · © OSM CONTRIBUTORS`;draw()}catch(e){attrib.textContent='MAP vector-native · FAILED';draw()}}
function manualize(){manual=true}sky.addEventListener('pointerdown',e=>{sky.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let p=[...pointers.values()];gesture={dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),zoom:view.zoom}}});sky.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId),dx=e.clientX-old.x,dy=e.clientY-old.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});manualize();if(pointers.size===1){let s=baseScale()*view.zoom;view.cx-=dx/s/nmlon();view.cy+=dy/s/60}else if(gesture){let p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);view.zoom=Math.max(.35,Math.min(8,gesture.zoom*d/gesture.dist))}draw()});function up(e){pointers.delete(e.pointerId);gesture=null;refresh()}sky.addEventListener('pointerup',up);sky.addEventListener('pointercancel',up);sky.addEventListener('wheel',e=>{e.preventDefault();manualize();view.zoom=Math.max(.35,Math.min(8,view.zoom*Math.exp(-e.deltaY*.001)));draw();clearTimeout(window.wt);window.wt=setTimeout(refresh,250)},{passive:false});addEventListener('resize',resize);renderPick();resize();loadMap();refresh();setInterval(refresh,30000);
</script></body></html>

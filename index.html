async function hydrateBoard(){board.innerHTML=`<div class="boardhead"><span>${HOME.iata||HOME.icao} AIRBORNE · ARRIVALS + DEPARTURES</span><span>LIVE</span></div><div class="meta" style="padding:14px 0">Resolving airborne ${HOME.iata||HOME.icao} arrivals and departures…</div>`;try{const c=new AbortController(),t=setTimeout(()=>c.abort(),9000),r=await fetch('/api/board?home='+encodeURIComponent(HOME.iata||HOME.icao),{cache:'no-store',signal:c.signal});clearTimeout(t);const j=await r.json();if(primaryView!=='BOARD')return;if(!r.ok||!j.ok)throw Error(j.error||'Board unavailable');renderBoardFlights(j.flights||[])}catch(e){if(primaryView==='BOARD')board.innerHTML=`<div class="boardhead"><span>${HOME.iata||HOME.icao} AIRBORNE · ARRIVALS + DEPARTURES</span><span>LIVE</span></div><div class="meta" style="padding:14px 0">Board feed unavailable. Sky remains live.</div>`}}
function setPrimaryView(v){primaryView=v;viewtitle.textContent=v;viewmenu.classList.remove('show');const skyOn=v==='SKY';board.classList.toggle('show',v==='BOARD');sky.style.display=skyOn?'block':'none';tiles.style.display=skyOn?'block':'none';rail.style.display=skyOn?'block':'none';recenter.style.display=skyOn&&(!manual&&centered())?'none':skyOn?'block':'none';attrib.style.display=skyOn?'block':'none';detail.classList.remove('show');if(v==='BOARD'){hydrateBoard()}else if(v!=='SKY'){board.classList.add('show');board.innerHTML='<div class="boardhead"><span>'+v+'</span><span>DOAA</span></div><div class="meta" style="padding:14px 0">This view is not implemented yet.</div>'}renderViewMenu()}
function setHome(ap){if(!ap)return;HOME=ap;localStorage.setItem('doaa.homeAerodrome',ap.icao);localStorage.setItem('doaa.homeAerodromeData',JSON.stringify(ap));manual=false;view={cx:ap.lon,cy:ap.lat,zoom:1};cellCache.clear();scout=null;renderCatchment();scheduleAcquire(80);draw()}
async function resolveHome(q){q=String(q||'').trim().toUpperCase();if(!q)return;const msg=catchment.querySelector('[data-home-status]');if(msg)msg.textContent='RESOLVING '+q+'…';try{const r=await fetch('/api/airport-lookup?q='+encodeURIComponent(q),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok||!j.airport)throw Error(j.error||'not found');const ap=j.airport;if(!AIRPORTS.some(a=>a.icao===ap.icao))AIRPORTS.push(ap);setHome(ap)}catch(e){if(msg)msg.textContent='AIRPORT NOT FOUND'}}
function renderCatchment(){const airportButtons=AIRPORTS.map(a=>`<button data-airport="${a.icao}" class="${a.icao===HOME.icao?'active':''}">${a.icao}</button>`).join('');catchment.innerHTML=`<div style="font:8px ui-monospace;color:#668899;margin:3px 4px 5px">HOME AERODROME · ${HOME.icao}</div><div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">${airportButtons}</div><div style="display:flex;gap:4px;margin-bottom:4px"><input data-home-query type="search" autocomplete="off" spellcheck="false" placeholder="ICAO / IATA CODE" style="min-width:0;flex:1;background:#06131b;border:1px solid #153746;color:#e5f0f4;font:10px ui-monospace;padding:6px"><button data-home-go>SET</button></div><div data-home-status style="min-height:12px;font:8px ui-monospace;color:#668899;margin:0 4px 5px">${HOME.name||''}</div><div style="font:8px ui-monospace;color:#668899;margin:3px 4px 5px">CATCHMENT</div>`+STEPS.map(n=>`<button data-n="${n}" class="${n===configured?'active':''}">${n} NM</button>`).join('');catchment.querySelectorAll('[data-airport]').forEach(b=>b.onclick=()=>setHome(AIRPORTS.find(a=>a.icao===b.dataset.airport)));const input=catchment.querySelector('[data-home-query]'),go=()=>resolveHome(input.value);catchment.querySelector('[data-home-go]').onclick=go;input.onkeydown=e=>{if(e.key==='Enter')go()};catchment.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{configured=+b.dataset.n;localStorage.setItem('doaa.catchmentNm',String(configured));renderCatchment();reset()})}
viewtitle.onclick=e=>{e.stopPropagation();catchment.classList.remove('show');viewmenu.classList.toggle('show');renderViewMenu()};status.onclick=()=>{viewmenu.classList.remove('show');catchment.classList.toggle('show');renderCatchment()};recenter.onclick=reset;racksearch.onclick=()=>{const on=!rail.classList.contains('searching');rail.classList.toggle('searching',on);if(on){rackquery.focus()}else{rackquery.value='';rackSearchResults=null;draw()}};rackquery.oninput=()=>{clearTimeout(rackSearchTimer);rackSearchTimer=setTimeout(()=>searchRack(rackquery.value),220)};
let pullY=null;pull.onpointerdown=e=>{pullY=e.clientY;pull.setPointerCapture(e.pointerId)};pull.onpointerup=e=>{const dy=e.clientY-(pullY??e.clientY);rail.classList.toggle('collapsed',Math.abs(dy)<18?!rail.classList.contains('collapsed'):dy>0);pullY=null;resize()};
sky.onpointerdown=e=>{sky.setPointerCapture(e.pointerId);moved=false;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY})};
sky.onpointermove=e=>{const p=pointers.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>7)moved=true;p.x=e.clientX;p.y=e.clientY;if(pointers.size===1&&moved){manual=true;const s=baseScale()*view.zoom;view.cx-=dx/s/nmlon();view.cy+=dy/s/60;draw()}if(pointers.size===2){manual=true;const ps=[...pointers.values()],d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);if(!sky._pinch)sky._pinch={d,z:view.zoom};else{view.zoom=Math.max(.22,Math.min(8,sky._pinch.z*d/sky._pinch.d));draw()}}};
sky.onpointerup=e=>{const p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(pointers.size<2)sky._pinch=null;if(!moved&&p){const h=hit(e.clientX,e.clientY);if(h&&h.type==='aircraft')selectEncounter(h.id);else if(h&&h.type==='airport')showAirport(h.ap);else{selected=null;detail.classList.remove('show');draw()}}else scheduleAcquire()};
sky.onwheel=e=>{e.preventDefault();manual=true;view.zoom=Math.max(.22,Math.min(8,view.zoom*Math.exp(-e.deltaY*.001)));draw();scheduleAcquire()};
window.addEventListener('resize',resize);renderViewMenu();renderCatchment();resize();fetch('/api/health',{cache:'no-store'}).then(r=>r.json()).then(j=>{build.textContent=`UI ${UI} · API ${j.build||'UNKNOWN'}`}).catch(()=>{build.textContent=`UI ${UI} · API UNREACHABLE`});refresh(false);setInterval(()=>refresh(false),30000);
</script></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02070c"><title>DOAA · Ottawa Sky</title>
<style>
:root{--bg:#02070c;--line:#153244;--cyan:#62ddff;--ice:#f1fbff;--muted:#668899;--purple:#b58cff;--amber:#ffc061;--rack:31vh}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ice);font-family:system-ui,sans-serif;overscroll-behavior:none}#tiles,#sky{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#tiles{filter:grayscale(1) brightness(.34) contrast(1.35) sepia(.25) hue-rotate(145deg) saturate(1.7)}.top{position:absolute;inset:0 0 auto;padding:18px 16px;display:flex;justify-content:space-between;pointer-events:none}.brand{font:600 10px ui-monospace;letter-spacing:.18em;color:var(--cyan)}.title{font-size:21px;margin-top:4px}.build{font:8px ui-monospace;color:var(--muted);margin-top:5px}.status{text-align:right;font:10px ui-monospace;color:var(--muted);line-height:1.55;white-space:nowrap;pointer-events:auto;cursor:pointer}.live{color:var(--cyan)}.view{color:var(--purple)}.partial{color:var(--amber)}.rail{position:absolute;bottom:0;left:0;right:0;max-height:var(--rack);overflow:auto;background:#020a10;border-top:1px solid var(--line);padding:4px 16px 12px;transition:max-height .2s ease}.pull{height:22px;display:flex;align-items:center;justify-content:center;touch-action:none}.pull:after{content:'';width:46px;height:4px;border-radius:3px;background:#668899}.rail.collapsed{max-height:30px;overflow:hidden}.rail.collapsed h2,.rail.collapsed #rack{display:none}.rail h2{font:600 10px ui-monospace;letter-spacing:.15em;color:var(--muted);margin:4px 0 10px}.row{padding:9px 0;border-top:1px solid rgba(21,50,68,.65);cursor:pointer}.row.sel{border-left:2px solid var(--ice);padding-left:8px}.call{font:600 13px ui-monospace}.meta{font:11px ui-monospace;color:var(--muted);margin-top:3px}.recenter{position:absolute;left:18px;border:1px solid rgba(98,221,255,.45);background:#020a10;color:var(--cyan);font:10px ui-monospace;padding:9px 11px;display:none;transition:bottom .2s ease}.attrib{position:absolute;left:8px;font:7px ui-monospace;color:rgba(98,221,255,.58);transition:bottom .2s ease}.detail{position:absolute;left:16px;top:104px;min-width:210px;max-width:300px;padding:10px 12px;border-left:1px solid var(--ice);background:rgba(2,10,16,.9);backdrop-filter:blur(7px);display:none;z-index:4}.detail.show{display:block}.dcall{font:600 14px ui-monospace}.dmeta{font:10px ui-monospace;color:var(--muted);line-height:1.55;margin-top:4px}.catchment{position:absolute;right:16px;top:74px;padding:8px;background:rgba(2,10,16,.96);border:1px solid var(--line);display:none;z-index:8}.catchment.show{display:flex;gap:5px;flex-wrap:wrap;max-width:245px}.catchment button{border:1px solid var(--line);background:#02070c;color:var(--muted);font:9px ui-monospace;padding:7px 8px}.catchment button.active{color:var(--cyan);border-color:rgba(98,221,255,.55)}
@media(min-width:701px){.rail{left:auto;top:92px;bottom:auto;right:18px;width:250px;max-height:calc(100vh - 110px);border:1px solid var(--line)}.rail.collapsed{max-height:30px}.recenter{bottom:56px!important}.attrib{bottom:8px!important}}
</style></head><body>
<canvas id="tiles"></canvas><canvas id="sky"></canvas><div class="top"><div><div class="brand">DOAA · OTTAWA AVIATION</div><div class="title">SKY</div><div class="build" id="build">UI sky-7.5 · API CHECKING</div></div><div class="status" id="status">ACQUIRING…</div></div><div id="catchment" class="catchment"></div><div id="detail" class="detail"></div><button id="recenter" class="recenter">⌖ LIVE VIEW</button><div id="attrib" class="attrib">MAP OSM · ACQUIRING</div><aside class="rail" id="rail"><div class="pull" id="pull"></div><h2>NEARBY AIRCRAFT</h2><div id="rack"></div></aside>
<script>
'use strict';
const UI='sky-7.5',STEPS=[10,20,30,40,45,50,60,70,80],YOW={lat:45.3225,lon:-75.6692};
const AIRPORTS=[{icao:'CYOW',name:'Ottawa Macdonald-Cartier',lat:45.3225,lon:-75.6692},{icao:'CYUL',name:'Montréal-Trudeau',lat:45.4706,lon:-73.7408},{icao:'KPBG',name:'Plattsburgh International',lat:44.6509,lon:-73.4681},{icao:'CYMX',name:'Montréal-Mirabel',lat:45.6819,lon:-74.0053},{icao:'CYHU',name:'Montréal Saint-Hubert',lat:45.5175,lon:-73.4169}];
let configured=45,view={cx:YOW.lon,cy:YOW.lat,zoom:1},manual=false,aircraft=[],tracks=new Map(),provider='ADS-B',now=Date.now(),selected=null,tileCache=new Map(),pointers=new Map(),moved=false,refreshTimer=null,refreshSeq=0,acquiring=false,cellState={ok:0,total:0};
const sky=document.getElementById('sky'),ctx=sky.getContext('2d'),tiles=document.getElementById('tiles'),tg=tiles.getContext('2d'),status=document.getElementById('status'),rack=document.getElementById('rack'),build=document.getElementById('build'),recenter=document.getElementById('recenter'),attrib=document.getElementById('attrib'),detail=document.getElementById('detail'),rail=document.getElementById('rail'),pull=document.getElementById('pull'),catchment=document.getElementById('catchment');
const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI;
function hav(a,b,c,d){const R=3440.065,p1=rad(a),p2=rad(c),dp=rad(c-a),dl=rad(d-b),q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function bearing(a,b,c,d){const p1=rad(a),p2=rad(c),dl=rad(d-b);return(deg(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)))+360)%360}
function nmlon(){return 60*Math.cos(rad(view.cy))}
function area(){const m=innerWidth<=700,top=92,bottom=m?(rail.classList.contains('collapsed')?30:innerHeight*.31):18,right=m?0:278,w=innerWidth-right,h=innerHeight-top-bottom;return{top,bottom,w,h,cx:w*.46,cy:top+h*.44}}
function positionControls(){if(innerWidth>700)return;const b=rail.classList.contains('collapsed')?42:innerHeight*.31+12;recenter.style.bottom=b+'px';attrib.style.bottom=(rail.classList.contains('collapsed')?32:innerHeight*.31+2)+'px'}
function baseScale(){const a=area();return Math.min(a.w*.9,a.h*.94)/(configured*2)}
function project(lat,lon){const s=baseScale()*view.zoom,a=area();return{x:a.cx+(lon-view.cx)*nmlon()*s,y:a.cy-(lat-view.cy)*60*s}}
function unproject(x,y){const s=baseScale()*view.zoom,a=area();return{lon:view.cx+(x-a.cx)/s/nmlon(),lat:view.cy-(y-a.cy)/s/60}}
function extent(){const a=area(),c=unproject(a.cx,a.cy),e=unproject(a.w,a.cy);return Math.max(1,Math.round(hav(c.lat,c.lon,e.lat,e.lon)))}
function centered(){return hav(YOW.lat,YOW.lon,view.cy,view.cx)<Math.max(1,configured*.025)}
function inView(a){const p=project(a.lat,a.lon),z=area();return p.x>=0&&p.x<=z.w&&p.y>=z.top&&p.y<=innerHeight-z.bottom}
function norm(x){if(x.lat==null||x.lon==null)return null;const ground=x.alt_baro==='ground',alt=Number(ground?0:(x.alt_baro??x.alt_geom??0));return{id:String(x.hex||x.icao||'').toLowerCase(),call:String(x.flight||x.r||x.hex||'UNKNOWN').trim(),lat:+x.lat,lon:+x.lon,alt,ground,gs:Number(x.gs||0),trk:Number(x.track||0),vr:Number(x.baro_rate??x.geom_rate??0),d:hav(YOW.lat,YOW.lon,+x.lat,+x.lon),br:bearing(YOW.lat,YOW.lon,+x.lat,+x.lon),type:x.t||''}}
function resize(){const d=devicePixelRatio||1;for(const c of[sky,tiles]){c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';c.getContext('2d').setTransform(d,0,0,d,0,0)}positionControls();draw()}
function ll2tile(lat,lon,z){const n=2**z;return{x:(lon+180)/360*n,y:(1-Math.asinh(Math.tan(rad(lat)))/Math.PI)/2*n}}
function tile2ll(x,y,z){const n=2**z;return{lon:x/n*360-180,lat:deg(Math.atan(Math.sinh(Math.PI*(1-2*y/n))))}}
function mapZoom(){const e=extent();return e<=12?11:e<=25?10:e<=50?9:e<=80?8:7}
function drawTiles(){tg.clearRect(0,0,innerWidth,innerHeight);tg.fillStyle='#02070c';tg.fillRect(0,0,innerWidth,innerHeight);const z=mapZoom(),a=area(),nw=unproject(-256,a.top-256),se=unproject(a.w+256,innerHeight-a.bottom+256),t0=ll2tile(nw.lat,nw.lon,z),t1=ll2tile(se.lat,se.lon,z);let drawn=0,pending=0;for(let x=Math.floor(t0.x);x<=Math.floor(t1.x);x++)for(let y=Math.floor(t0.y);y<=Math.floor(t1.y);y++){const key=`${z}/${x}/${y}`;let im=tileCache.get(key);if(!im){im=new Image();im.crossOrigin='anonymous';im.onload=()=>draw();im.onerror=()=>{im.bad=true};im.src=`https://tile.openstreetmap.org/${key}.png`;tileCache.set(key,im);pending++;continue}if(!im.complete||im.bad){pending++;continue}const p0=tile2ll(x,y,z),p1=tile2ll(x+1,y+1,z),q0=project(p0.lat,p0.lon),q1=project(p1.lat,p1.lon);tg.drawImage(im,q0.x,q0.y,q1.x-q0.x,q1.y-q0.y);drawn++}attrib.textContent=`MAP OSM · ${drawn?'READY':pending?'LOADING':'UNAVAILABLE'} · © OPENSTREETMAP CONTRIBUTORS`}
function trailAlpha(age,sel,dim){const m=age/60000;let a=m<=2?.92:m<=5?.72:m<=10?.48:m<=20?.27:m<=30?.14:.07;if(sel)a=Math.min(1,a*1.28);if(dim)a*=.22;return a}
function drawTrack(id,e,current,t){const pts=(e&&e.points)||[],sel=id===selected,dim=!!selected&&!sel;for(let i=1;i<pts.length;i++){const age=t-pts[i].t;if(age>(current?5400000:1800000))continue;const p0=project(pts[i-1].lat,pts[i-1].lon),p1=project(pts[i].lat,pts[i].lon);ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.strokeStyle=`rgba(241,251,255,${trailAlpha(age,sel,dim)*(current?1:.75)})`;ctx.lineWidth=sel?2.2:Math.max(1,1.3*Math.min(1,view.zoom+.45));ctx.stroke()}}
function draw(){drawTiles();ctx.clearRect(0,0,innerWidth,innerHeight);const t=Date.now(),current=new Set(aircraft.map(a=>a.id));for(const [id,e] of tracks)if(!current.has(id))drawTrack(id,e,false,t);for(const a of aircraft.filter(a=>!a.ground&&inView(a))){drawTrack(a.id,tracks.get(a.id),true,t);const p=project(a.lat,a.lon),sel=a.id===selected,dim=!!selected&&!sel;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(rad(a.trk));ctx.globalAlpha=dim?.22:1;ctx.fillStyle='#f1fbff';ctx.beginPath();ctx.moveTo(0,sel?-8:-6);ctx.lineTo(sel?4:3,sel?6:5);ctx.lineTo(0,sel?4:3);ctx.lineTo(sel?-4:-3,sel?6:5);ctx.closePath();ctx.fill();ctx.restore()}for(const ap of AIRPORTS){const p=project(ap.lat,ap.lon),a=area();if(p.x<-20||p.x>a.w+20||p.y<a.top-20||p.y>innerHeight-a.bottom+20)continue;ctx.strokeStyle='rgba(98,221,255,.85)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.moveTo(p.x-8,p.y);ctx.lineTo(p.x+8,p.y);ctx.moveTo(p.x,p.y-8);ctx.lineTo(p.x,p.y+8);ctx.stroke();ctx.fillStyle='#62ddff';ctx.font='9px ui-monospace';ctx.fillText(ap.icao,p.x+9,p.y+3)}const vis=aircraft.filter(a=>!a.ground&&inView(a)),live=!manual&&centered(),coverage=cellState.total>1?` · ${cellState.ok}/${cellState.total} CELLS`:'';status.innerHTML=`<span class="${live?'live':'view'}">${vis.length} AIRBORNE / ${live?'YOW '+configured:'VIEW '+extent()}</span><br>${acquiring?'<span class="partial">ACQUIRING VIEW…</span>':provider+coverage+' · '+new Date(now).toISOString().slice(11,19)+'Z'}`;recenter.style.display=live?'none':'block';rack.innerHTML=vis.slice().sort((a,b)=>a.d-b.d).slice(0,10).map(a=>`<div class="row ${a.id===selected?'sel':''}" data-id="${a.id}"><div class="call">${a.call}</div><div class="meta">${Math.round(a.alt).toLocaleString()} FT · ${Math.round(a.d)} NM YOW · ${Math.round(a.br).toString().padStart(3,'0')}°</div><div class="meta">${a.type||a.id.toUpperCase()} · ${a.vr>200?'CLB':a.vr<-200?'DES':'LVL'} · ${Math.round(a.gs)} KT</div></div>`).join('')||'<div class="meta">No airborne traffic in view.</div>';rack.querySelectorAll('.row').forEach(el=>el.onclick=()=>selectAircraft(el.dataset.id));positionControls()}
function selectAircraft(id){selected=id;const a=aircraft.find(x=>x.id===id);if(!a)return;detail.classList.add('show');detail.innerHTML=`<div class="dcall">${a.call}</div><div class="dmeta">${a.type||a.id.toUpperCase()} · ${Math.round(a.alt).toLocaleString()} FT<br>${Math.round(a.gs)} KT · ${Math.round(a.trk).toString().padStart(3,'0')}° · ${a.vr>200?'CLB':a.vr<-200?'DES':'LVL'}<br>${Math.round(a.d)} NM FROM YOW · ${Math.round(a.br).toString().padStart(3,'0')}°<br>HEX ${a.id.toUpperCase()}</div>`;draw()}
function segDist(px,py,a,b,c,d){const dx=c-a,dy=d-b,l=dx*dx+dy*dy;if(!l)return Math.hypot(px-a,py-b);const q=Math.max(0,Math.min(1,((px-a)*dx+(py-b)*dy)/l));return Math.hypot(px-(a+q*dx),py-(b+q*dy))}
function hit(x,y){let best=null,bd=20;for(const a of aircraft.filter(q=>!q.ground&&inView(q))){const p=project(a.lat,a.lon),d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best={type:'aircraft',id:a.id}}}if(best)return best;bd=13;for(const [id,e] of tracks){const pts=(e&&e.points)||[];for(let i=1;i<pts.length;i++){const p=project(pts[i-1].lat,pts[i-1].lon),q=project(pts[i].lat,pts[i].lon),d=segDist(x,y,p.x,p.y,q.x,q.y);if(d<bd){bd=d;best={type:'aircraft',id}}}}if(best&&aircraft.some(a=>a.id===best.id))return best;bd=20;for(const ap of AIRPORTS){const p=project(ap.lat,ap.lon),d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best={type:'airport',ap}}}return best}
async function showAirport(ap){selected=null;detail.classList.add('show');detail.innerHTML=`<div class="dcall">${ap.icao} · ${ap.name}</div><div class="dmeta">ACQUIRING CONDITIONS…</div>`;draw();try{const r=await fetch(`/api/airport?icao=${ap.icao}`,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error('conditions');const m=j.metar||{},raw=m.rawOb||m.raw_text||'',flt=m.fltCat||m.flight_category||'',wind=(m.wdir!=null?String(m.wdir).padStart(3,'0')+'° ':'')+(m.wspd!=null?m.wspd+' KT':'')+(m.wgst!=null?' G'+m.wgst:''),vis=m.visib??m.visibility;detail.innerHTML=`<div class="dcall">${ap.icao} · ${ap.name}</div><div class="dmeta">${flt?flt+' · ':''}${wind||'WIND N/A'}${vis!=null?' · VIS '+vis+' SM':''}${raw?'<br><br>'+raw:''}</div>`}catch(e){detail.innerHTML=`<div class="dcall">${ap.icao} · ${ap.name}</div><div class="dmeta">CONDITIONS UNAVAILABLE</div>`}}
function viewportCells(){if(!manual&&centered())return[{lat:YOW.lat,lon:YOW.lon,dist:configured}];const a=area(),nw=unproject(0,a.top),se=unproject(a.w,innerHeight-a.bottom),midLat=(nw.lat+se.lat)/2,midLon=(nw.lon+se.lon)/2,w=hav(midLat,nw.lon,midLat,se.lon),h=hav(nw.lat,midLon,se.lat,midLon),nx=Math.min(5,Math.max(1,Math.ceil(w/60))),ny=Math.min(5,Math.max(1,Math.ceil(h/60))),out=[];for(let iy=0;iy<ny;iy++)for(let ix=0;ix<nx;ix++){const lat=nw.lat+(se.lat-nw.lat)*(iy+.5)/ny,lon=nw.lon+(se.lon-nw.lon)*(ix+.5)/nx,cw=w/nx,ch=h/ny;out.push({lat,lon,dist:Math.min(80,Math.max(15,Math.ceil(Math.hypot(cw/2,ch/2)+8)))})}return out}
function mergeResponses(rs){const am=new Map(),tm=new Map();for(const j of rs){for(const raw of j.aircraft||[]){const a=norm(raw);if(a&&a.id)am.set(a.id,a)}for(const [id0,e] of Object.entries(j.tracks||{})){const id=id0.toLowerCase(),cur=tm.get(id)||{firstSeen:e.firstSeen,lastSeen:e.lastSeen,points:[]},pts=[...cur.points,...(e.points||[])].sort((a,b)=>a.t-b.t),ded=[];for(const p of pts){const q=ded[ded.length-1];if(!q||p.t!==q.t)ded.push(p)}cur.points=ded;cur.lastSeen=Math.max(cur.lastSeen||0,e.lastSeen||0);tm.set(id,cur)}}return{aircraft:[...am.values()],tracks:tm}}
async function refresh(){const seq=++refreshSeq,cells=viewportCells(),stamp=Date.now();acquiring=true;cellState={ok:0,total:cells.length};draw();const settled=await Promise.allSettled(cells.map(async c=>{const r=await fetch(`/api/traffic?lat=${c.lat.toFixed(4)}&lon=${c.lon.toFixed(4)}&dist=${c.dist}&_=${stamp}`,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error('traffic');return j}));if(seq!==refreshSeq)return;const rs=settled.filter(x=>x.status==='fulfilled').map(x=>x.value);cellState={ok:rs.length,total:cells.length};acquiring=false;if(!rs.length){build.textContent=`UI ${UI} · API ERROR`;status.innerHTML='<span class="partial">DATA LINK UNAVAILABLE</span>';return}const merged=mergeResponses(rs);aircraft=merged.aircraft;tracks=merged.tracks;const j=rs[0];provider=(j.provider||'ADS-B')+(rs.length<cells.length?' · PARTIAL':'');now=Math.max(...rs.map(x=>x.now||0));build.textContent=`UI ${UI} · API ${j.build||'LEGACY'}`;draw()}
function reset(){view={cx:YOW.lon,cy:YOW.lat,zoom:1};manual=false;catchment.classList.remove('show');draw();refresh()}
function renderCatchment(){catchment.innerHTML=STEPS.map(n=>`<button data-n="${n}" class="${n===configured?'active':''}">${n} NM</button>`).join('');catchment.querySelectorAll('button').forEach(b=>b.onclick=()=>{configured=+b.dataset.n;renderCatchment();reset()})}
status.onclick=()=>{catchment.classList.toggle('show');renderCatchment()};recenter.onclick=reset;
let pullY=null;pull.onpointerdown=e=>{pullY=e.clientY;pull.setPointerCapture(e.pointerId)};pull.onpointerup=e=>{const dy=e.clientY-(pullY??e.clientY);rail.classList.toggle('collapsed',Math.abs(dy)<18?!rail.classList.contains('collapsed'):dy>0);pullY=null;resize()};
sky.onpointerdown=e=>{sky.setPointerCapture(e.pointerId);moved=false;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY})};
sky.onpointermove=e=>{const p=pointers.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>7)moved=true;p.x=e.clientX;p.y=e.clientY;if(pointers.size===1&&moved){manual=true;const s=baseScale()*view.zoom;view.cx-=dx/s/nmlon();view.cy+=dy/s/60;draw()}if(pointers.size===2){manual=true;const ps=[...pointers.values()],d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);if(!sky._pinch)sky._pinch={d,z:view.zoom};else{view.zoom=Math.max(.22,Math.min(8,sky._pinch.z*d/sky._pinch.d));draw()}}};
sky.onpointerup=e=>{const p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(pointers.size<2)sky._pinch=null;if(!moved&&p){const h=hit(e.clientX,e.clientY);if(h&&h.type==='aircraft')selectAircraft(h.id);else if(h&&h.type==='airport')showAirport(h.ap);else{selected=null;detail.classList.remove('show');draw()}}else{clearTimeout(refreshTimer);refreshTimer=setTimeout(refresh,350)}};
sky.onwheel=e=>{e.preventDefault();manual=true;view.zoom=Math.max(.22,Math.min(8,view.zoom*Math.exp(-e.deltaY*.001)));draw();clearTimeout(refreshTimer);refreshTimer=setTimeout(refresh,350)};
window.addEventListener('resize',resize);renderCatchment();resize();refresh();setInterval(refresh,30000);
</script></body></html>

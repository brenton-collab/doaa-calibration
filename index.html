<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02070c"><title>DOAA · Ottawa Sky</title><style>:root{--bg:#02070c;--panel:#07131c;--line:#153244;--cyan:#62ddff;--ice:#dff7ff;--muted:#668899;--amber:#ffc061}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ice);font-family:Inter,system-ui,sans-serif}body{background:radial-gradient(circle at 52% 42%,#09202b 0,#031019 35%,#02070c 72%)}#sky{position:absolute;inset:0;width:100%;height:100%}.top{position:absolute;top:0;left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand{font:600 11px ui-monospace,monospace;letter-spacing:.22em;color:var(--cyan)}.title{font-size:21px;letter-spacing:.03em;margin-top:4px}.status{text-align:right;font:11px ui-monospace,monospace;color:var(--muted);line-height:1.55}.status b{color:var(--ice);font-weight:500}.rail{position:absolute;right:18px;top:92px;width:230px;background:rgba(4,14,21,.82);border-left:1px solid var(--line);padding:14px;backdrop-filter:blur(8px)}.rail h2{font:600 10px ui-monospace,monospace;letter-spacing:.15em;color:var(--muted);margin:0 0 10px}.row{padding:9px 0;border-top:1px solid rgba(21,50,68,.65);cursor:pointer}.row:first-of-type{border-top:0}.call{font:600 13px ui-monospace,monospace;color:var(--ice)}.meta{font:11px ui-monospace,monospace;color:var(--muted);margin-top:3px}.look{color:var(--amber)}.foot{position:absolute;left:20px;bottom:18px;font:10px ui-monospace,monospace;color:var(--muted);letter-spacing:.08em}.error{color:var(--amber)}@media(max-width:700px){.rail{top:auto;bottom:0;right:0;left:0;width:auto;max-height:31vh;overflow:auto;border-left:0;border-top:1px solid var(--line)}.foot{display:none}}</style></head><body><canvas id="sky"></canvas><div class="top"><div><div class="brand">DOAA · OTTAWA AVIATION</div><div class="title">SKY</div></div><div class="status" id="status">ACQUIRING OTTAWA<br><b>ADS-B</b></div></div><aside class="rail"><h2>NEARBY AIRCRAFT</h2><div id="rack"></div></aside><div class="foot">CYOW · HOME SKY · LIVE</div><script>
const HOME={lat:45.37094,lon:-75.70229};const YOW={lat:45.3225,lon:-75.6692};const RADIUS_NM=45;const canvas=document.querySelector('#sky'),ctx=canvas.getContext('2d'),rack=document.querySelector('#rack'),status=document.querySelector('#status');let aircraft=[],tracks=new Map(),provider='';
const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI;function hav(a,b,c,d){const R=3440.065,p1=rad(a),p2=rad(c),dp=rad(c-a),dl=rad(d-b),q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function bearing(a,b,c,d){const p1=rad(a),p2=rad(c),dl=rad(d-b);return(deg(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)))+360)%360}function norm(a){return(a+360)%360}function balconyVisible(b){return b>=205&&b<=359}function normalize(x){let lat=x.lat,lon=x.lon;if(lat==null||lon==null)return null;let alt=Number(x.alt_baro==='ground'?0:x.alt_baro??x.alt_geom??0),gs=Number(x.gs??0),trk=Number(x.track??0),vr=Number(x.baro_rate??x.geom_rate??0);let d=hav(HOME.lat,HOME.lon,lat,lon),br=bearing(HOME.lat,HOME.lon,lat,lon);return{id:(x.hex||x.icao||Math.random()).trim?.()||x.hex,call:(x.flight||x.callsign||x.r||x.hex||'UNKNOWN').trim(),hex:x.hex||'',lat,lon,alt,gs,trk,vr,d,br,squawk:x.squawk||'',type:x.t||x.type||'',visible:balconyVisible(br)&&alt>300}}
async function source(url,name){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(name+' '+r.status);const j=await r.json();const arr=j.ac||j.aircraft||[];provider=name;return arr.map(normalize).filter(Boolean).filter(a=>a.d<=RADIUS_NM)}
async function refresh(){let data=null,errs=[];for(const [u,n] of [[`https://api.adsb.lol/v2/point/${HOME.lat}/${HOME.lon}/${RADIUS_NM}`,'ADSB.LOL'],[`https://opendata.adsb.fi/api/v2/lat/${HOME.lat}/lon/${HOME.lon}/dist/${RADIUS_NM}`,'ADSB.FI']]){try{data=await source(u,n);break}catch(e){errs.push(e.message)}}if(!data){status.innerHTML='<span class="error">DATA LINK UNAVAILABLE</span><br>'+errs.join(' · ');return}aircraft=data.sort((a,b)=>a.d-b.d);let now=Date.now();for(const a of aircraft){let t=tracks.get(a.id)||[];t.push({lat:a.lat,lon:a.lon,t:now});tracks.set(a.id,t.filter(p=>now-p.t<180000))}status.innerHTML=`${aircraft.length} AIRCRAFT · ${provider}<br><b>${new Date().toISOString().slice(11,19)}Z</b>`;renderRack();draw()}
function renderRack(){rack.innerHTML=aircraft.slice(0,9).map(a=>`<div class="row"><div class="call ${a.visible?'look':''}">${a.visible?'◈ ':''}${a.call}</div><div class="meta">${a.alt?Math.round(a.alt).toLocaleString()+' FT':'GROUND'} · ${Math.round(a.d)} NM · ${Math.round(a.br).toString().padStart(3,'0')}°</div><div class="meta">${a.type||a.hex.toUpperCase()} · ${a.vr>200?'CLB':a.vr<-200?'DES':'LVL'} · ${Math.round(a.gs)} KT</div></div>`).join('')||'<div class="meta">No traffic returned.</div>'}
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}function project(lat,lon){const max=RADIUS_NM,dx=hav(HOME.lat,HOME.lon,HOME.lat,lon)*(lon<HOME.lon?-1:1),dy=hav(HOME.lat,HOME.lon,lat,HOME.lon)*(lat<HOME.lat?-1:1),scale=Math.min(innerWidth*.72,innerHeight*.82)/(max*2);return{x:innerWidth*.43+dx*scale,y:innerHeight*.52-dy*scale}}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);let c=project(HOME.lat,HOME.lon);ctx.strokeStyle='rgba(98,221,255,.07)';ctx.lineWidth=1;for(let r=10;r<=40;r+=10){ctx.beginPath();ctx.arc(c.x,c.y,r*Math.min(innerWidth*.72,innerHeight*.82)/(RADIUS_NM*2),0,Math.PI*2);ctx.stroke()}let y=project(YOW.lat,YOW.lon);ctx.fillStyle='rgba(223,247,255,.7)';ctx.fillRect(y.x-2,y.y-2,4,4);ctx.font='10px ui-monospace';ctx.fillText('CYOW',y.x+7,y.y+3);ctx.fillStyle='rgba(98,221,255,.55)';ctx.fillRect(c.x-2,c.y-2,4,4);ctx.fillText('HOME',c.x+7,c.y+3);for(const a of aircraft){let pts=tracks.get(a.id)||[];if(pts.length>1){ctx.beginPath();pts.forEach((p,i)=>{let q=project(p.lat,p.lon);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.strokeStyle='rgba(98,221,255,.23)';ctx.stroke()}let p=project(a.lat,a.lon);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(rad(a.trk));ctx.fillStyle=a.visible?'#ffc061':'#62ddff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=8;ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(3,5);ctx.lineTo(0,3);ctx.lineTo(-3,5);ctx.closePath();ctx.fill();ctx.restore();ctx.shadowBlur=0;ctx.fillStyle=a.visible?'#ffc061':'rgba(223,247,255,.82)';ctx.font='10px ui-monospace';ctx.fillText(a.call,p.x+8,p.y+3)}}
addEventListener('resize',resize);resize();refresh();setInterval(refresh,5000);
</script></body></html>

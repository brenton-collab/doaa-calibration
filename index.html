function segDist(px,py,a,b,c,d){const dx=c-a,dy=d-b,l=dx*dx+dy*dy;if(!l)return Math.hypot(px-a,py-b);const q=Math.max(0,Math.min(1,((px-a)*dx+(py-b)*dy)/l));return Math.hypot(px-(a+q*dx),py-(b+q*dy))}
function hit(x,y){let best=null,bd=20;for(const a of aircraft.filter(q=>!q.ground&&inView(q))){const p=project(a.lat,a.lon),d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best={type:'aircraft',id:a.id}}}if(best)return best;bd=13;for(const [id,e] of tracks){if(!aircraft.some(a=>a.id===id)&&Date.now()-(e.lastSeen||0)>GHOST_LIFE)continue;const pts=(e&&e.points)||[];for(let i=1;i<pts.length;i++){const p=project(pts[i-1].lat,pts[i-1].lon),q=project(pts[i].lat,pts[i].lon),d=segDist(x,y,p.x,p.y,q.x,q.y);if(d<bd){bd=d;best={type:'aircraft',id}}}}if(best)return best;bd=20;for(const ap of AIRPORTS){const p=project(ap.lat,ap.lon),d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best={type:'airport',ap}}}return best}
async function showAirport(ap){selected=null;detail.classList.add('show');detail.innerHTML=`<div class="dcall">${ap.icao} · ${ap.name}</div><div class="dmeta">ACQUIRING CONDITIONS…</div>`;draw();try{const r=await fetch(`/api/airport?icao=${ap.icao}`,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error('conditions');const m=j.metar||{},raw=m.rawOb||m.raw_text||'',flt=m.fltCat||m.flight_category||'',wind=(m.wdir!=null?String(m.wdir).padStart(3,'0')+'° ':'')+(m.wspd!=null?m.wspd+' KT':'')+(m.wgst!=null?' G'+m.wgst:''),vis=m.visib??m.visibility;detail.innerHTML=`<div class="dcall">${ap.icao} · ${ap.name}</div><div class="dmeta">${flt?flt+' · ':''}${wind||'WIND N/A'}${vis!=null?' · VIS '+vis+' SM':''}${raw?'<br><br>'+raw:''}</div>`}catch(e){detail.innerHTML=`<div class="dcall">${ap.icao} · ${ap.name}</div><div class="dmeta">CONDITIONS UNAVAILABLE</div>`}}
function gridCell(iy,ix){return{iy,ix,lat:(iy+.5)*GRID_LAT-90,lon:(ix+.5)*GRID_LON-180,dist:GRID_RADIUS,key:`g:${iy}:${ix}`}}
function viewportCells(){if(!manual&&centered())return[{lat:YOW.lat,lon:YOW.lon,dist:configured,key:`yow:${configured}`}];const a=area(),p1=unproject(0,a.top),p2=unproject(a.w,innerHeight-a.bottom),north=Math.max(p1.lat,p2.lat),south=Math.min(p1.lat,p2.lat),west=Math.min(p1.lon,p2.lon),east=Math.max(p1.lon,p2.lon),iy0=Math.floor((south+90)/GRID_LAT),iy1=Math.floor((north+90)/GRID_LAT),ix0=Math.floor((west+180)/GRID_LON),ix1=Math.floor((east+180)/GRID_LON),out=[];for(let iy=iy0;iy<=iy1;iy++)for(let ix=ix0;ix<=ix1;ix++)out.push(gridCell(iy,ix));return out}
function cellKey(c){return c.key||`${c.lat.toFixed(2)}:${c.lon.toFixed(2)}:${Math.round(c.dist/5)*5}`}
function cellPriority(c){let p=hav(view.cy,view.cx,c.lat,c.lon);for(const ap of AIRPORTS){const d=hav(ap.lat,ap.lon,c.lat,c.lon);if(d<=c.dist)p-=Math.max(18,55-d)}return p}
function mergeResponses(rs){const am=new Map(),tm=new Map();for(const j of rs){for(const raw of j.aircraft||[]){const a=norm(raw);if(a&&a.id){am.set(a.id,a);lastAircraft.set(a.id,a)}}for(const [id0,e] of Object.entries(j.tracks||{})){const id=id0.toLowerCase(),cur=tm.get(id)||{firstSeen:e.firstSeen,lastSeen:e.lastSeen,points:[]},pts=[...cur.points,...(e.points||[])].sort((a,b)=>a.t-b.t),ded=[];for(const p of pts){const q=ded[ded.length-1];if(!q||p.t!==q.t)ded.push(p)}cur.points=ded;cur.lastSeen=Math.max(cur.lastSeen||0,e.lastSeen||0);tm.set(id,cur)}}const cutoff=Date.now()-GHOST_LIFE;for(const [id,e] of [...tm])if(!am.has(id)&&(e.lastSeen||0)<cutoff)tm.delete(id);return{aircraft:[...am.values()],tracks:tm}}
function compose(cells){const rs=[];let newest=0,prov='ADS-B',ok=0;for(const c of cells){const e=cellCache.get(cellKey(c));if(!e||!e.data)continue;rs.push(e.data);ok++;newest=Math.max(newest,e.at||0);prov=e.data.provider||prov}if(scout&&Date.now()-scout.at<CELL_STALE&&hav(view.cy,view.cx,scout.lat,scout.lon)<scout.dist*.8){rs.push(scout.data);newest=Math.max(newest,scout.at);prov=scout.data.provider||prov}if(rs.length){const merged=mergeResponses(rs);aircraft=merged.aircraft;tracks=merged.tracks;provider=prov;now=newest||now}else{aircraft=[];tracks=new Map()}cellState.ok=ok;draw()}
async function requestTraffic(c){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);try{const r=await fetch(`/api/traffic?lat=${c.lat.toFixed(4)}&lon=${c.lon.toFixed(4)}&dist=${c.dist}&_=${Date.now()}`,{cache:'no-store',signal:ac.signal}),j=await r.json();build.textContent=`UI ${UI} · API ${j.build||('HTTP '+r.status)}`;if(!r.ok||!j.ok)throw new Error((j.errors||[]).join(' · ')||j.error||'traffic');return j}finally{clearTimeout(tm)}}
async function fetchScout(seq){const dist=Math.min(80,Math.max(30,extent()*.75)),lat=view.cy,lon=view.cx;try{const j=await requestTraffic({lat,lon,dist});if(seq!==refreshSeq)return false;scout={lat,lon,dist,data:j,at:Date.now()};compose(viewportCells());return true}catch(e){return false}}
async function fetchCell(c,seq){const key=cellKey(c),old=cellCache.get(key);try{const j=await requestTraffic(c);cellCache.set(key,{data:j,at:Date.now(),state:'live',failedAt:0});return true}catch(e){cellCache.set(key,old&&old.data?{...old,state:'stale',failedAt:Date.now()}:{data:null,at:0,state:'failed',failedAt:Date.now()});return false}finally{if(seq===refreshSeq){cellState.pending=Math.max(0,cellState.pending-1);compose(viewportCells())}}}
async function runQueue(queue,seq){let next=0;async function worker(){while(seq===refreshSeq&&next<queue.length){const c=queue[next++];await fetchCell(c,seq)}}await Promise.all(Array.from({length:Math.min(MAX_CONCURRENT,queue.length)},worker))}
async function refresh(force=false){const seq=++refreshSeq,cells=viewportCells(),t=Date.now();cellState={ok:0,total:cells.length,pending:0};compose(cells);const need=cells.filter(c=>{const e=cellCache.get(cellKey(c));if(!force&&e?.failedAt&&t-e.failedAt<FAIL_BACKOFF)return false;return force||!e||!e.data||t-e.at>CELL_FRESH}).sort((a,b)=>cellPriority(a)-cellPriority(b));const scoutUseful=scout&&t-scout.at<SCOUT_FRESH&&hav(view.cy,view.cx,scout.lat,scout.lon)<scout.dist*.55;if(!need.length&&scoutUseful){acquiring=false;draw();return}acquiring=true;cellState.pending=need.length+(scoutUseful?0:1);draw();if(!scoutUseful){await fetchScout(seq);if(seq!==refreshSeq)return;cellState.pending=Math.max(0,cellState.pending-1);draw()}if(need.length)await runQueue(need,seq);if(seq!==refreshSeq)return;acquiring=false;compose(viewportCells());const usable=cells.some(c=>cellCache.get(cellKey(c))?.data)||scout;if(!usable&&!aircraft.length)status.innerHTML='<span class="partial">DATA LINK UNAVAILABLE</span>';else draw()}
function scheduleAcquire(ms=500){clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>refresh(false),ms)}
function reset(){view={cx:YOW.lon,cy:YOW.lat,zoom:1};manual=false;catchment.classList.remove('show');const y=cellCache.get(`yow:${configured}`);if(y?.data){scout={lat:YOW.lat,lon:YOW.lon,dist:configured,data:y.data,at:y.at};}compose(viewportCells());scheduleAcquire(80)}
function renderCatchment(){catchment.innerHTML=STEPS.map(n=>`<button data-n="${n}" class="${n===configured?'active':''}">${n} NM</button>`).join('');catchment.querySelectorAll('button').forEach(b=>b.onclick=()=>{configured=+b.dataset.n;renderCatchment();reset()})}
status.onclick=()=>{catchment.classList.toggle('show');renderCatchment()};recenter.onclick=reset;racksearch.onclick=()=>{const on=!rail.classList.contains('searching');rail.classList.toggle('searching',on);if(on){rackquery.focus()}else{rackquery.value='';rackSearchResults=null;draw()}};rackquery.oninput=()=>{clearTimeout(rackSearchTimer);rackSearchTimer=setTimeout(()=>searchRack(rackquery.value),220)};
let pullY=null;pull.onpointerdown=e=>{pullY=e.clientY;pull.setPointerCapture(e.pointerId)};pull.onpointerup=e=>{const dy=e.clientY-(pullY??e.clientY);rail.classList.toggle('collapsed',Math.abs(dy)<18?!rail.classList.contains('collapsed'):dy>0);pullY=null;resize()};
sky.onpointerdown=e=>{sky.setPointerCapture(e.pointerId);moved=false;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY})};
sky.onpointermove=e=>{const p=pointers.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>7)moved=true;p.x=e.clientX;p.y=e.clientY;if(pointers.size===1&&moved){manual=true;const s=baseScale()*view.zoom;view.cx-=dx/s/nmlon();view.cy+=dy/s/60;draw()}if(pointers.size===2){manual=true;const ps=[...pointers.values()],d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);if(!sky._pinch)sky._pinch={d,z:view.zoom};else{view.zoom=Math.max(.22,Math.min(8,sky._pinch.z*d/sky._pinch.d));draw()}}};
sky.onpointerup=e=>{const p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(pointers.size<2)sky._pinch=null;if(!moved&&p){const h=hit(e.clientX,e.clientY);if(h&&h.type==='aircraft')selectEncounter(h.id);else if(h&&h.type==='airport')showAirport(h.ap);else{selected=null;detail.classList.remove('show');draw()}}else scheduleAcquire()};
sky.onwheel=e=>{e.preventDefault();manual=true;view.zoom=Math.max(.22,Math.min(8,view.zoom*Math.exp(-e.deltaY*.001)));draw();scheduleAcquire()};
window.addEventListener('resize',resize);renderCatchment();resize();fetch('/api/health',{cache:'no-store'}).then(r=>r.json()).then(j=>{build.textContent=`UI ${UI} · API ${j.build||'UNKNOWN'}`}).catch(()=>{build.textContent=`UI ${UI} · API UNREACHABLE`});refresh(false);setInterval(()=>refresh(false),30000);
</script></body></html>

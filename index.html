<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02070c"><title>DOAA · Ottawa Sky</title><style>:root{--bg:#02070c;--line:#153244;--cyan:#62ddff;--ice:#f1fbff;--muted:#668899;--purple:#b58cff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ice);font-family:system-ui,sans-serif;overscroll-behavior:none}#tiles,#sky{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#tiles{filter:grayscale(1) brightness(.34) contrast(1.35) sepia(.25) hue-rotate(145deg) saturate(1.7)}.top{position:absolute;inset:0 0 auto;padding:18px 16px;display:flex;justify-content:space-between;pointer-events:none}.brand{font:600 10px ui-monospace;letter-spacing:.18em;color:var(--cyan);max-width:190px}.title{font-size:21px;margin-top:4px}.build{font:8px ui-monospace;color:var(--muted);margin-top:5px}.status{pointer-events:auto;text-align:right;font:10px ui-monospace;color:var(--muted);line-height:1.55;white-space:nowrap;cursor:pointer}.live{color:var(--cyan)}.view{color:var(--purple)}.rail{position:absolute;bottom:0;left:0;right:0;max-height:31vh;overflow:auto;background:#020a10;border-top:1px solid var(--line);padding:12px 16px}.rail h2{font:600 10px ui-monospace;letter-spacing:.15em;color:var(--muted);margin:0 0 10px}.row{padding:9px 0;border-top:1px solid rgba(21,50,68,.65);cursor:pointer}.row.sel{border-left:2px solid var(--ice);padding-left:8px;background:rgba(241,251,255,.035)}.call{font:600 13px ui-monospace}.meta{font:11px ui-monospace;color:var(--muted);margin-top:3px}.recenter{position:absolute;left:18px;bottom:33vh;border:1px solid rgba(98,221,255,.45);background:#020a10;color:var(--cyan);font:10px ui-monospace;letter-spacing:.08em;padding:9px 11px;display:none}.pick{position:fixed;right:14px;top:70px;z-index:20;background:#020a10;border:1px solid #24485c;padding:8px;displ const UI='sky-7.3',YOW={lat:45.3225,lon:-75.6692},STEPS=[10,20,30,40,45,50,60,70,80],C='#62ddff';let configured=45,view={cx:YOW.lon,cy:YOW.lat,zoom:1},manual=false,aircraft=[],tracks=new Map(),provider='ADS-B',now=Date.now(),pointers=new Map(),gesture=null,selected=null,pointerMoved=false,tileCache=new Map();const sky=document.querySelector('#sky'),ctx=sky.getContext('2d'),tiles=document.querySelector('#tiles'),tg=tiles.getContext('2d'),status=document.querySelector('#status'),rack=document.querySelector('#rack'),build=document.querySelector('#build'),pick=document.querySelector('#pick'),recenter=document.querySelector('#recenter'),attrib=document.querySelector('#attrib'),detail=document.querySelector('#detail');const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI,nmlon=()=>60*Math.cos(rad(YOW.lat));function hav(a,b,c,d){let R=3440.065,p1=rad(a),p2=rad(c),dp=rad(c-a),dl=rad(d-b),q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function bearing(a,b,c,d){let p1=rad(a),p2=rad(c),dl=rad(d-b);return(deg(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)))+360)%360}function area(){let m=innerWidth<=700,top=92,bottom=m?innerHeight*.31:18,right=m?0:278,w=innerWidth-right,h=innerHeight-top-bottom;return{left:0,right,top,bottom,w,h,cx:w*.46,cy:top+h*.44}}function baseScale(){let a=area();return Math.min(a.w*.90,a.h*.94)/(configured*2)}function project(lat,lon){let s=baseScale()*view.zoom,a=area();return{x:a.cx+(lon-view.cx)*nmlon()*s,y:a.cy-(lat-view.cy)*60*s}}function unproject(x,y){let s=baseScale()*view.zoom,a=area();return{lon:view.cx+(x-a.cx)/s/nmlon(),lat:view.cy-(y-a.cy)/s/60}}function resize(){let d=devicePixelRatio||1;for(const c of[sky,tiles]){c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';c.getContext('2d').setTransform(d,0,0,d,0,0)}draw()}function extent(){let a=area(),c=unproject(a.cx,a.cy),e=unproject(a.left+a.w,a.cy);return Math.max(1,Math.round(hav(c.lat,c.lon,e.lat,e.lon)))}function centered(){return hav(YOW.lat,YOW.lon,view.cy,view.cx)<Math.max(1,configured*.025)}function inView(a){let p=project(a.lat,a.lon),z=area();return p.x>=z.left&&p.x<=z.left+z.w&&p.y>=z.top&&p.y<=innerHeight-z.bottom}function norm(x){if(x.lat==null||x.lon==null)return null;let ground=x.alt_baro==='ground',alt=Number(ground?0:x.alt_baro??x.alt_geom??0),d=hav(YOW.lat,YOW.lon,x.lat,x.lon);return{id:String(x.hex||'').toLowerCase(),call:String(x.flight||x.r||x.hex||'UNKNOWN').trim(),lat:x.lat,lon:x.lon,alt,ground,gs:Number(x.gs||0),trk:Number(x.track||0),vr:Number(x.baro_rate??x.geom_rate??0),d,br:bearing(YOW.lat,YOW.lon,x.lat,x.lon),type:x.t||''}}function reset(){view={cx:YOW.lon,cy:YOW.lat,zoom:1};manual=false;draw();refresh()}function renderPick(){pick.innerHTML=STEPS.map(n=>`<button data-n="${n}" class="${n===configured?'on':''}">${n} NM</button>`).join('');pick.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();configured=+b.dataset.n;renderPick();pick.classList.remove('show');reset()})}status.onclick=e=>{e.stopPropagation();pick.classList.toggle('show')};document.addEventListener('click',()=>pick.classList.remove('show'));recenter.onclick=reset;
function ll2tile(lat,lon,z){let n=2**z,x=(lon+180)/360*n,y=(1-Math.asinh(Math.tan(rad(lat)))/Math.PI)/2*n;return{x,y}}function tile2ll(x,y,z){let n=2**z,lon=x/n*360-180,lat=deg(Math.atan(Math.sinh(Math.PI*(1-2*y/n))));return{lat,lon}}function mapZoom(){let e=extent();return e<=12?11:e<=25?10:e<=50?9:e<=80?8:7}function drawTiles(){tg.clearRect(0,0,innerWidth,innerHeight);tg.fillStyle='#02070c';tg.fillRect(0,0,innerWidth,innerHeight);let z=mapZoom(),a=area(),nw=unproject(a.left-256,a.top-256),se=unproject(a.left+a.w+256,innerHeight-a.bottom+256),t0=ll2tile(nw.lat,nw.lon,z),t1=ll2tile(se.lat,se.lon,z),pending=0,drawn=0;for(let x=Math.floor(t0.x);x<=Math.floor(t1.x);x++)for(let y=Math.floor(t0.y);y<=Math.floor(t1.y);y++){let key=`${z}/${x}/${y}`,im=tileCache.get(key);if(!im){im=new Image();im.crossOrigin='anonymous';im.onload=()=>{draw();};im.onerror=()=>{im.bad=true;draw();};im.src=`https://tile.openstreetmap.org/${key}.png`;tileCache.set(key,im);pending++;continue}if(!im.complete||im.bad){pending++;continue}let p0=tile2ll(x,y,z),p1=tile2ll(x+1,y+1,z),q0=project(p0.lat,p0.lon),q1=project(p1.lat,p1.lon);tg.globalAlpha=.9;tg.drawImage(im,q0.x,q0.y,q1.x-q0.x,q1.y-q0.y);drawn++}tg.globalAlpha=1;attrib.textContent=drawn?`MAP OSM · READY · © OPENSTREETMAP CONTRIBUTORS`:`MAP OSM · ${pending?'LOADING':'UNAVAILABLE'} · © OPENSTREETMAP CONTRIBUTORS`}
function trailAlpha(age,sel,dim){let m=age/60000,a=m<=5?.82:m<=15?.56:m<=30?.32:.08;if(sel)a=Math.min(1,a*1.35);if(dim)a*=.2;return a}function select(id){selected=id&&aircraft.some(a=>a.id===id)?id:null;let a=aircraft.find(x=>x.id===selected);detail.classList.toggle('show',!!a);if(a)detail.innerHTML=`<div class="dcall">${a.call}</div><div class="dmeta">${a.type||a.id.toUpperCase()} · ${Math.round(a.alt).toLocaleString()} FT<br>${Math.round(a.gs)} KT · ${Math.round(a.trk).toString().padStart(3,'0')}° · ${a.vr>200?'CLB':a.vr<-200?'DES':'LVL'}<br>${Math.round(a.d)} NM FROM YOW · ${Math.round(a.br).toString().padStart(3,'0')}°</div>`;draw()}function hitAircraft(x,y){let hit=null,best=20;for(const a of aircraft.filter(q=>!q.ground&&inView(q))){let p=project(a.lat,a.lon),d=Math.hypot(p.x-x,p.y-y);if(d<best){best=d;hit=a.id}}return hit}
function draw(){drawTiles();ctx.clearRect(0,0,innerWidth,innerHeight);let c=project(YOW.lat,YOW.lon),s=baseScale()*view.zoom;ctx.strokeStyle='rgba(98,221,255,.15)';ctx.setLineDash([3,4]);for(let r=10;r<=configured;r+=10){ctx.beginPath();ctx.arc(c.x,c.y,r*s,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(102,136,153,.82)';ctx.font='8px ui-monospace';ctx.fillText(r+' NM',c.x+r*s*.72,c.y-r*s*.69)}ctx.setLineDash([]);ctx.strokeStyle='rgba(241,251,255,.55)';ctx.lineWidth=2;function rw(h,len){let x=rad(h),dy=Math.cos(x)*len/120,dx=Math.sin(x)*len/(2*nmlon()),a=project(YOW.lat-dy,YOW.lon-dx),b=project(YOW.lat+dy,YOW.lon+dx);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}rw(70,1.75);rw(140,1.35);ctx.fillStyle=C;ctx.fillRect(c.x-2,c.y-2,4,4);ctx.font='10px ui-monospace';ctx.fillText('CYOW',c.x+7,c.y+3);let vis=aircraft.filter(a=>!a.ground&&inView(a)),t=Date.now();for(const a of vis){let sel=a.id===selected,dim=selected&&!sel,pts=tracks.get(a.id)?.points||[];for(let i=1;i<pts.length;i++){let age=t-pts[i].t;if(age>5400000)continue;let p0=project(pts[i-1].lat,pts[i-1].lon),p1=project(pts[i].lat,pts[i].lon);ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.strokeStyle=`rgba(241,251,255,${trailAlpha(age,sel,dim)})`;ctx.lineWidth=sel?2:1.25;ctx.stroke()}let p=project(a.lat,a.lon);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(rad(a.trk));ctx.globalAlpha=dim?.22:1;ctx.fillStyle='#f1fbff';ctx.shadowColor=sel?'#f1fbff':'transparent';ctx.shadowBlur=sel?9:0;ctx.beginPath();ctx.moveTo(0,sel?-8:-6);ctx.lineTo(sel?4:3,sel?6:5);ctx.lineTo(0,sel?4:3);ctx.lineTo(sel?-4:-3,sel?6:5);ctx.closePath();ctx.fill();ctx.restore();if(sel||(!selected&&(a.d<15||view.zoom>1.25))){ctx.globalAlpha=dim?.22:1;ctx.fillStyle='rgba(241,251,255,.88)';ctx.font=`${sel?'600 ':''}10px ui-monospace`;ctx.fillText(a.call,p.x+9,p.y+3);ctx.globalAlpha=1}}let live=!manual&&centered(),label=live?'YOW':'VIEW',r=live?configured:extent(),cl=live?'live':'view';status.innerHTML=`<span class="${cl}">${vis.length} AIRBORNE / ${label} ${r}</span><br>${provider} · ${new Date(now).toISOString().slice(11,19)}Z`;recenter.style.display=live?'none':'block';rack.innerHTML=vis.sort((a,b)=>a.d-b.d).slice(0,8).map(a=>`<div class="row ${a.id===selected?'sel':''}" data-id="${a.id}"><div class="call">${a.call}</div><div class="meta">${Math.round(a.alt).toLocaleString()} FT · ${Math.round(a.d)} NM YOW · ${Math.round(a.br).toString().padStart(3,'0')}°</div><div class="meta">${a.type||a.id.toUpperCase()} · ${a.vr>200?'CLB':a.vr<-200?'DES':'LVL'} · ${Math.round(a.gs)} KT</div></div>`).join('')||'<div class="meta">No airborne traffic in view.</div>';rack.querySelectorAll('.row').forEach(el=>el.onclick=()=>select(el.dataset.id))}
async function refresh(){try{let need=Math.min(80,Math.max(configured,extent()+Math.ceil(hav(YOW.lat,YOW.lon,view.cy,view.cx)))),r=await fetch(`/api/traffic?dist=${need}&_=${Date.now()}`,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error((j.errors||[`HTTP ${r.status}`]).join(' · '));build.textContent=`UI ${UI} · API ${j.build||'LEGACY'}`;aircraft=(j.aircraft||[]).map(norm).filter(Boolean);tracks=new Map(Object.entries(j.tracks||{}).map(([id,e])=>[id.toLowerCase(),e]));provider=j.provider||'ADS-B';now=j.now||Date.now();if(selected&&!aircraft.some(a=>a.id===selected))select(null);else draw()}catch(e){status.innerHTML='<span style="color:#ffc061">DATA LINK UNAVAILABLE</span>'}}function manualize(){manual=true}sky.addEventListener('pointerdown',e=>{sky.setPointerCapture(e.pointerId);pointerMoved=false;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});if(pointers.size===2){let p=[...pointers.values()];gesture={dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),zoom:view.zoom}}});sky.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId),dx=e.clientX-old.x,dy=e.clientY-old.y;if(Math.hypot(e.clientX-old.sx,e.clientY-old.sy)>7)pointerMoved=true;pointers.set(e.pointerId,{...old,x:e.clientX,y:e.clientY});if(pointerMoved)manualize();if(pointers.size===1&&pointerMoved){let s=baseScale()*view.zoom;view.cx-=dx/s/nmlon();view.cy+=dy/s/60}else if(gesture){manualize();let p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);view.zoom=Math.max(.35,Math.min(8,gesture.zoom*d/gesture.dist))}draw()});function up(e){let p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(pointers.size<2)gesture=null;if(p&&!pointerMoved&&Math.hypot(e.clientX-p.sx,e.clientY-p.sy)<8)select(hitAircraft(e.clientX,e.clientY));else refresh();pointerMoved=false}sky.addEventListener('pointerup',up);sky.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);gesture=null;pointerMoved=false});sky.addEventListener('wheel',e=>{e.preventDefault();manualize();view.zoom=Math.max(.35,Math.min(8,view.zoom*Math.exp(-e.deltaY*.001)));draw();clearTimeout(window.wt);window.wt=setTimeout(refresh,250)},{passive:false});addEventListener('resize',resize);renderPick();resize();refresh();setInterval(refresh,30000);
</script></body></html>

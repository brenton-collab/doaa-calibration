sky.onpointermove=e=>{const p=pointers.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>7)moved=true;p.x=e.clientX;p.y=e.clientY;if(pointers.size===1&&moved){manual=true;const s=baseScale()*view.zoom;view.cx-=dx/s/nmlon();view.cy+=dy/s/60;draw()}if(pointers.size===2){manual=true;const ps=[...pointers.values()],d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);if(!sky._pinch)sky._pinch={d,z:view.zoom};else{view.zoom=Math.max(.22,Math.min(8,sky._pinch.z*d/sky._pinch.d));draw()}}};
sky.onpointerup=e=>{const p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(pointers.size<2)sky._pinch=null;if(!moved&&p){const h=hit(e.clientX,e.clientY);if(h&&h.type==='aircraft')selectEncounter(h.id);else if(h&&h.type==='airport')showAirport(h.ap);else{selected=null;detail.classList.remove('show');draw()}}else scheduleAcquire()};
sky.onwheel=e=>{e.preventDefault();manual=true;view.zoom=Math.max(.22,Math.min(8,view.zoom*Math.exp(-e.deltaY*.001)));draw();scheduleAcquire()};
window.addEventListener('resize',resize);renderViewMenu();renderCatchment();resize();fetch('/api/health',{cache:'no-store'}).then(r=>r.json()).then(j=>{build.textContent=`UI ${UI} · API ${j.build||'UNKNOWN'} · USAGE ↗`}).catch(()=>{build.textContent=`UI ${UI} · API UNREACHABLE · USAGE ↗`});const quotaPanel=document.getElementById('quota-panel'),quotaData=document.getElementById('quota-data');
function quotaText(v){return v==null?'Not reported':String(v)}
async function loadProviderUsage(){quotaData.textContent='Loading telemetry…';try{const r=await fetch('/api/ops',{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Telemetry unavailable');const s=j.state||{},m=j.meter||{};quotaData.replaceChildren();const lines=[['Provider remaining',quotaText(s.provider_remaining)],['Provider used',quotaText(s.provider_used)],['Provider quota',quotaText(s.quota_units)],['Local metered requests',quotaText(m.requests)],['Local counted calls',quotaText(s.local_calls)],['Reset',quotaText(s.reset_at)]];for(const [name,value] of lines){const line=document.createElement('div');line.textContent=name+': '+value;quotaData.append(line)}const note=document.createElement('small');note.textContent=(s.authority==='provider'?'Provider values are reported by AirLabs.':'Provider quota not confirmed; local counts are not account-wide balances.')+' Last observation: '+quotaText(s.observed_at);quotaData.append(note)}catch(e){quotaData.textContent='Usage telemetry unavailable. No quota balance can be inferred.'}}
function toggleProviderUsage(){const open=!quotaPanel.classList.contains('open');quotaPanel.classList.toggle('open',open);build.setAttribute('aria-expanded',String(open));if(open)loadProviderUsage()}
document.getElementById('quota-close').addEventListener('click',()=>{quotaPanel.classList.remove('open');build.setAttribute('aria-expanded','false');build.focus()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&quotaPanel.classList.contains('open')){quotaPanel.classList.remove('open');build.setAttribute('aria-expanded','false');build.focus()}});build.addEventListener('click',toggleProviderUsage);build.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleProviderUsage()}});
refresh(false);setInterval(()=>refresh(false),30000);

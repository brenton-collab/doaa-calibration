name: Preview DOAA (manual only)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doaa-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check vector-base.js
          node --check preview-proxy.js
          node --check src/worker.js
          node --check doaa-memory.js
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html','utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          for (const [,code] of scripts) if (code.trim()) new vm.Script(code);
          console.log('Validated',scripts.length,'inline script blocks');
          NODE
      - name: Publish isolated Cloudflare preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc

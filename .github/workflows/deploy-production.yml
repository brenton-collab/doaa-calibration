name: Deploy DOAA production
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vector-base.js'
      - 'flight-enrichment.js'
      - 'ambient.js'
      - 'ambient.css'
      - 'ambient-media.js'
      - 'look.js'
      - 'scripts/build-assets.cjs'
      - 'tests/**'
      - 'airlabs-budget.test.cjs'
      - 'src/**'
      - 'doaa-memory.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doaa-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloudflare deployment credential gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Missing CLOUDFLARE_API_TOKEN. Set it in repository Actions secrets before deploying.' >&2
            exit 1
          fi
      - name: Syntax gate
        run: |
          node --check src/worker.js
          node --check vector-base.js
          node --check flight-enrichment.js
          node --check doaa-memory.js
          node --test tests/*.test.cjs tests/*.test.mjs airlabs-budget.test.cjs
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html','utf8');
          for (const [,source] of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)) if(source.trim()) new vm.Script(source);
          NODE
      - name: Package curated web assets
        run: node scripts/build-assets.cjs
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7e63bcb7915749183e2cb592a8f802eb
          wranglerVersion: '4.149.0'
          command: deploy --config wrangler.jsonc

name: Syntax check
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '**.js'
      - 'index.html'
      - '.github/workflows/syntax-check.yml'
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: node --check doaa-memory.js
  enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: node --check flight-enrichment.js
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: node --check relay.js
  helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check catchment.js
          node --check map-overlay.js
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp src/worker.js /tmp/doaa-worker.mjs
          node --check /tmp/doaa-worker.mjs
  inline-html:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path("index.html").read_text()
          blocks=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>",html,re.I)
          inline=[b for b in blocks if b.strip()]
          if not inline:
              raise SystemExit("No inline scripts found")
          for i,b in enumerate(inline):
              p=Path(tempfile.gettempdir())/f"doaa-inline-{i}.js"
              p.write_text(b)
              subprocess.run(["node","--check",str(p)],check=True)
          PY

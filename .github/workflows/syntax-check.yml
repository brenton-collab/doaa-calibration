name: Syntax check
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '**.js'
      - 'index.html'
      - '.github/workflows/syntax-check.yml'
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: node --check doaa-memory.js
  enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: node --check flight-enrichment.js
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: node --check relay.js
  helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check catchment.js
          node --check map-overlay.js
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp src/worker.js /tmp/doaa-worker.mjs
          node --check /tmp/doaa-worker.mjs
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Static semantic contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          worker=Path("src/worker.js").read_text()
          memory=Path("doaa-memory.js").read_text()
          enrichment=Path("flight-enrichment.js").read_text()
          browser=Path("index.html").read_text()+enrichment
          public=re.search(r"if\(!\[(.*?)\]\.includes\(u\.pathname\)\)return json\(\{ok:false,error:'not found'\},404\)",worker,re.S)
          if not public:
              raise SystemExit("Public memory allowlist guard not found")
          allowed=set(re.findall(r"['\"](/memory/[^'\"]+)['\"]",public.group(1)))
          expected={"/memory/health","/memory/dossier","/memory/history","/memory/search"}
          if allowed != expected:
              raise SystemExit(f"Public memory surface changed: {sorted(allowed)}")
          forbidden={"/memory/observe","/memory/ingest","/memory/history-request","/memory/history-result","/memory/lead","/memory/leads"}
          leaked=[p for p in forbidden if p in browser]
          if leaked:
              raise SystemExit(f"Browser mutation path leak: {leaked}")
          if "p.observation_source!=='acquisition'" not in memory:
              raise SystemExit("Acquisition-only observation guard missing")
          if "INSERT OR IGNORE INTO observations" not in memory:
              raise SystemExit("Observation idempotency insert missing")
          if "COUNT(DISTINCT sc.value_text)=1" not in memory:
              raise SystemExit("Conflict-safe claim projection missing")
          if "conflicting_predicates" not in memory:
              raise SystemExit("Conflict metadata missing from search")
          print("semantic contracts ok")
          PY
  inline-html:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path("index.html").read_text()
          blocks=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>",html,re.I)
          inline=[b for b in blocks if b.strip()]
          if not inline:
              raise SystemExit("No inline scripts found")
          for i,b in enumerate(inline):
              p=Path(tempfile.gettempdir())/f"doaa-inline-{i}.js"
              p.write_text(b)
              subprocess.run(["node","--check",str(p)],check=True)
          PY
